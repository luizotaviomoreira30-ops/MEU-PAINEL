<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Financeiro</title>
<meta name="theme-color" content="#0B2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/financeiro.css">
</head>
<body data-auth="pending">
<section class="login" id="login" aria-live="polite">
  <div class="login-card">
    <span class="brand-mark big" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg></span>
    <h1>Meu Financeiro</h1>
    <p id="login-msg">Carregando…</p>
    <p class="form-error" id="login-err" hidden></p>
    <button type="button" class="btn primary wide" id="login-btn" hidden>Entrar com Google</button>
    <div class="pw-box" id="pw-box" hidden></div>
    <div class="pw-box" id="verify-box" hidden></div>
    <button type="button" class="btn wide" id="logout-btn" hidden>Sair desta conta</button>
    <a class="link" href="../">Voltar ao Meu Painel</a>
  </div>
</section>

<div class="shell">
  <aside class="side" id="side" aria-label="Menu">
    <a class="brand" href="#/visao-geral">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg></span>
      <span class="brand-txt"><b>Meu Financeiro</b><small id="me-name"></small></span>
    </a>
    <nav class="side-nav" id="nav" aria-label="Módulos"></nav>
    <div class="side-foot">
      <a class="side-link" href="../">← Meu Painel</a>
      <button type="button" class="side-link" id="signout">Sair</button>
    </div>
  </aside>
  <div class="scrim-nav" id="scrim-nav" hidden></div>
  <div class="content">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="top-title"><h1 id="page-title">Visão geral</h1><p id="page-sub"></p></div>
      <div class="top-tools">
        <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
        <button type="button" class="btn primary" id="new-txn">+ Lançamento</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<button type="button" class="fab" id="fab" aria-label="Novo lançamento">+</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
