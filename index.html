<style>
/* Layout: a desk planner — compact header with area switch, top tabs on desktop and a bottom bar on phones, each view a grid of plain panels on a cool green-grey ground. */
:root {
  --bg: #F1F3EF;
  --surface: #FFFFFF;
  --surface-2: #E8EBE5;
  --ink: #18201C;
  --muted: #5C6660;
  --line: #D6DBD3;
  --accent: #1E5F4E;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9EAE3;
  --work: #2952C9;
  --work-soft: #E2E8F9;
  --life: #C0503A;
  --life-soft: #F7E3DD;
  --high: #C2362B;
  --high-soft: #F8E0DD;
  --mid: #A86D12;
  --mid-soft: #F6EAD3;
  --low: #75807A;
  --ok: #2B8656;
  --ok-soft: #DCEFE3;
  --fin: #173B5E; --fin-soft: #E6ECF3;
  --shadow: 0 1px 2px rgba(20, 35, 28, .06), 0 4px 16px rgba(20, 35, 28, .06);
  --scrim: rgba(18, 24, 21, .45);
  --side: #15302A;
  --side-ink: #E4EFEA;
  --side-muted: #9DB8AE;
  --side-active: rgba(255, 255, 255, .13);
  --card-shadow: 0 1px 2px rgba(20, 35, 28, .05), 0 2px 10px rgba(20, 35, 28, .04);

  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #191E1B; --surface-2: #222824; --ink: #E6EBE7; --muted: #98A29C; --line: #2D3531;
    --accent: #62C2A2; --accent-ink: #0D1A15; --accent-soft: #1D3A30;
    --work: #86A6F7; --work-soft: #1E2944; --life: #EF8D75; --life-soft: #432621;
    --high: #F2776C; --high-soft: #45211E; --mid: #E2AA4E; --mid-soft: #3D2F17; --low: #8D9690;
    --ok: #5EC68D; --ok-soft: #1B3527;
    --fin: #6F9BC8; --fin-soft: #1B2633;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6);
    --side: #18221E; --side-ink: #E6EBE7; --side-muted: #8FA59C; --side-active: rgba(255,255,255,.08); --card-shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #191E1B; --surface-2: #222824; --ink: #E6EBE7; --muted: #98A29C; --line: #2D3531;
  --accent: #62C2A2; --accent-ink: #0D1A15; --accent-soft: #1D3A30;
  --work: #86A6F7; --work-soft: #1E2944; --life: #EF8D75; --life-soft: #432621;
  --high: #F2776C; --high-soft: #45211E; --mid: #E2AA4E; --mid-soft: #3D2F17; --low: #8D9690;
  --ok: #5EC68D; --ok-soft: #1B3527;
  --fin: #6F9BC8; --fin-soft: #1B2633;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6);
    --side: #18221E; --side-ink: #E6EBE7; --side-muted: #8FA59C; --side-active: rgba(255,255,255,.08); --card-shadow: none;
  color-scheme: dark;
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Shell: sidebar on desktop, icon rail on tablets, bottom bar on phones */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; align-items: start; }
.side { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); margin: 12px 0 12px max(12px, env(safe-area-inset-left, 0px)); height: calc(100vh - 24px - env(safe-area-inset-top, 0px)); background: var(--side); color: var(--side-ink); border-radius: 18px; display: flex; flex-direction: column; gap: 22px; padding: 18px 12px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; padding: 4px 8px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-txt { display: grid; line-height: 1.15; min-width: 0; }
.brand-txt b { font-family: var(--f-display); font-size: 16px; }
.brand-txt small { color: var(--side-muted); font-size: 12px; }
.side-nav { display: grid; gap: 4px; }
.side-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; color: var(--side-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
.side-nav a:hover { color: var(--side-ink); background: rgba(255, 255, 255, .05); }
.side-nav a[aria-current="page"] { background: var(--side-active); color: var(--side-ink); }
.side-nav svg { width: 20px; height: 20px; flex: none; }
.side-nav .count { margin-left: auto; }
.side-nav .grp { padding: 14px 12px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--side-muted); opacity: .75; }
.side-nav .grp:first-child { padding-top: 0; }
.side-nav a.ext .lbl::after { content: " ↗"; opacity: .7; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid rgba(255, 255, 255, .1); font-size: 13px; min-width: 0; }
.side-foot .me-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); font-size: 13px; flex: none; }
.content { min-width: 0; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.top { padding-block: 22px 6px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; max-width: 1240px; }
.hello { display: grid; gap: 4px; min-width: 0; }
.hello h1 { font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; }
.hello .lead { color: var(--muted); font-size: 15px; }
.top-tools { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
.save-state { font-family: var(--f-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state.err { color: var(--high); font-weight: 500; }
.date-pill { text-decoration: none; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 8px 12px; display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; color: var(--ink); box-shadow: var(--card-shadow); }
.date-pill svg { width: 18px; height: 18px; color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.count { font-family: var(--f-data); font-size: 11px; background: var(--high-soft); color: var(--high); border-radius: 999px; padding: 1px 6px; font-weight: 500; }
.bottomnav { display: none; }

main { padding-block: 14px 56px; display: grid; gap: 18px; max-width: 1240px; }

@media (max-width: 1023px) and (min-width: 760px) {
  .shell { grid-template-columns: 84px minmax(0, 1fr); }
  .side { padding: 16px 10px; align-items: center; }
  .brand { padding: 4px; }
  .brand-txt, .side-nav .lbl, .side-foot .me-name { display: none; }
  .side-nav a { justify-content: center; padding: 11px; position: relative; }
  .side-nav .grp { font-size: 0; padding: 6px 0 0; margin: 6px 10px 0; border-top: 1px solid rgba(255, 255, 255, .08); }
  .side-nav .grp:first-child { display: none; }
  .side-nav .count { position: absolute; top: 2px; right: 2px; margin: 0; }
  .side-foot { justify-content: center; padding-inline: 0; }
  .content { padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 759px) {
  .shell { display: block; }
  .side { display: none; }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { padding-block: 14px 2px; }
  .hello .lead { font-size: 14px; }
  .bottomnav {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  }
  .bottomnav a { display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 4px 0; position: relative; min-width: 0; }
  .bottomnav a span.lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottomnav a[aria-current="page"] { color: var(--accent); }
  .bottomnav svg { width: 22px; height: 22px; }
  .bottomnav .count { position: absolute; top: 0; left: calc(50% + 6px); padding: 0 5px; font-size: 10px; }
  main { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
}

/* Overview: stat cards, timeline, weekly habit grid */
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats4.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1100px) { .stats4.six { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat4.c-fin { background: var(--fin-soft); } .stat4.c-fin .ic { background: var(--fin); }
.stat4.c-late { background: var(--high-soft); } .stat4.c-late .ic { background: var(--high); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
/* Mais (phone) */
.more-scrim { position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, .28); }
.more-scrim[hidden] { display: none; }
.more-sheet { position: absolute; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 18px 18px 0 0; padding: 14px 16px 16px; max-height: 70vh; overflow-y: auto; box-shadow: 0 -8px 24px rgba(0, 0, 0, .12); }
.more-sheet .grp { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 6px; }
.more-sheet .grp:first-child { margin-top: 0; }
.more-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.more-sheet a { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: var(--surface-2); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; min-width: 0; }
.more-sheet a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more-sheet a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.more-sheet a svg { width: 20px; height: 20px; flex: none; }
.more-sheet a .count { margin-left: auto; }
.more-sheet .more-ext { margin-top: 12px; background: none; border: 1px solid var(--line); }
@media (min-width: 760px) { .more-scrim { display: none !important; } }
.bottomnav .more-btn { display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); background: none; border: 0; padding: 4px 0; position: relative; min-width: 0; }
.bottomnav .more-btn[aria-current="page"] { color: var(--accent); }
.bottomnav .more-btn span.lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Aniversários */
.due.wrap { white-space: normal; }
.bday-ic { font-size: 20px; width: 28px; text-align: center; flex: none; }
.row.bday-today { background: var(--mid-soft); border-radius: 12px; padding-inline: 8px; }
.notice.bday { border-color: var(--mid); background: var(--mid-soft); color: var(--ink); }
/* Modo foco */
.focus-go { font-size: 11px; color: var(--accent); flex: none; }
.focus-card { justify-items: center; text-align: center; gap: 14px; padding-block: 28px; }
.focus-card .focus-what { font-weight: 600; font-size: 16px; max-width: 100%; overflow-wrap: anywhere; }
.focus-clock { font-family: var(--f-display); font-size: clamp(64px, 14vw, 112px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.focus-clock.small { font-size: 48px; }
.focus-card .bar { width: min(420px, 100%); }
.focus-card.pause .focus-clock { color: var(--ok); }
.focus-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid var(--accent); }
.focus-strip.pause { background: var(--ok-soft); border-color: var(--ok); }
.focus-strip .fs-main { flex: 1 1 200px; display: flex; gap: 10px; align-items: baseline; color: var(--ink); text-decoration: none; min-width: 0; }
.focus-strip .fs-main span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.focus-strip .fs-main b { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
/* Lista de compras */
.shop-row .row-title { font-size: 15px; }
@media (max-width: 759px) { .shop-row { padding-block: 12px; } .shop-row .check { width: 28px; height: 28px; } }
.fin-kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.fin-kpi { padding: 14px 16px; border-radius: 14px; background: var(--surface-2, rgba(0,0,0,.03)); display: grid; gap: 4px; min-width: 0; }
.fin-kpi .k { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.fin-kpi .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fin-kpi .v.neg { color: var(--high); } .fin-kpi .v.pos { color: var(--ok); }
.fin-kpi .s { font-size: 12px; color: var(--muted); }
.fin-line { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.fin-line:last-child { border-bottom: 0; }
.fin-line .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fin-line .a { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.fin-line .a.in { color: var(--ok); }
.fin-line small { display: block; color: var(--muted); font-size: 12px; }
.fin-line small.late { color: var(--high); font-weight: 600; }
.stat4 { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; border: 1px solid transparent; text-align: left; color: var(--ink); min-width: 0; background: var(--accent-soft); }
.stat4:hover { border-color: var(--line); }
.stat4 .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--surface); background: var(--accent); flex: none; }
.stat4 .ic svg { width: 22px; height: 22px; }
.stat4 .tx { display: grid; gap: 2px; min-width: 0; }
.stat4 .n { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat4 .l { font-size: 13px; font-weight: 600; color: var(--ink); opacity: .8; }
.stat4 .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat4 .s.warn { color: var(--high); font-weight: 600; }
.stat4.c-work { background: var(--work-soft); } .stat4.c-work .ic { background: var(--work); }
.stat4.c-ok { background: var(--ok-soft); } .stat4.c-ok .ic { background: var(--ok); }
.stat4.c-mid { background: var(--mid-soft); } .stat4.c-mid .ic { background: var(--mid); }
@media (max-width: 480px) { .stat4 { padding: 12px; gap: 10px; } .stat4 .ic { width: 38px; height: 38px; } .stat4 .n { font-size: 22px; } }
.home2 { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
@media (max-width: 900px) { .home2 { grid-template-columns: minmax(0, 1fr); } }
.ph-title { display: inline-flex; align-items: center; gap: 9px; }
.ph-title svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.tl { display: grid; gap: 10px; position: relative; }
.tl::before { content: ""; position: absolute; left: 61px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.tl-row { display: grid; grid-template-columns: 48px 10px minmax(0, 1fr) auto; align-items: center; gap: 0 12px; position: relative; }
.tl-time { font-family: var(--f-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--work); box-shadow: 0 0 0 3px var(--surface); z-index: 1; }
.tl-row.life .tl-dot { background: var(--life); }
.tl-pill { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 11px; background: var(--work-soft); border: 0; text-align: left; min-width: 0; font-weight: 500; color: var(--ink); }
.tl-row.life .tl-pill { background: var(--life-soft); }
.tl-pill .pi { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--work); color: var(--surface); flex: none; }
.tl-row.life .tl-pill .pi { background: var(--life); }
.tl-pill .pi svg { width: 16px; height: 16px; }
.tl-pill .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ring { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: var(--surface); flex: none; }
.ring.on { background: var(--ok); border-color: var(--ok); }
.hw { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 28px); gap: 8px 6px; align-items: center; }
.hw .dl { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.hw .dl.today { color: var(--accent); }
.hw .nm { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hw .nm:hover { color: var(--accent); }
.hd { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); padding: 0; display: grid; place-items: center; font-size: 12px; color: var(--surface); justify-self: center; }
.hd[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.hd.is-today { border-color: var(--accent); }
.hd[aria-pressed="true"].is-today { border-color: var(--ok); box-shadow: 0 0 0 2px var(--accent-soft); }
.hd:disabled { opacity: .35; cursor: default; border-style: dashed; }
@media (max-width: 400px) { .hw { grid-template-columns: minmax(0, 1fr) repeat(7, 24px); gap: 8px 4px; } .hd { width: 22px; height: 22px; } }
.gp { display: grid; gap: 6px; }
.gp-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.gp-top .nm { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; overflow-wrap: anywhere; }
.gp-top .pc { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }

.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; color: var(--muted); font-size: 14px; }

/* Buttons & inputs */

/* Modal */

  /* =========================================================

  function openForm({ title, fields, values = {}, onSave, onDelete, saveLabel = "Salvar", extra }) {

    const close = () => { if (saving) return; scrim.remove(); document.removeEventListener("keydown", onKey); };
    const form = h("form", { class: "form", id: "modal-form", novalidate: false });
    for (const f of fields) {
      if (f.type === "heading") { form.append(h("div", { class: "form-heading full", text: f.label })); continue; }
      if (f.type === "node") { form.append(h("div", { class: "full" }, f.node)); continue; }
      const id = "f-" + f.key;
      const v = values[f.key] ?? f.default ?? "";
      let input;
      if (f.type === "checkbox") {
        input = h("input", { type: "checkbox", id, name: f.key });

      }
      if (f.type === "select") {

      } else if (f.type === "textarea") {
        input = h("textarea", { class: "field", id, name: f.key, rows: f.rows || 3, placeholder: f.placeholder });
      } else {
        input = h("input", { class: "field", id, name: f.key, type: f.type || "text", required: f.required, step: f.step, inputmode: f.inputmode, placeholder: f.placeholder, autocomplete: "off", list: f.suggestions ? id + "-list" : null });

        f.suggestions ? h("datalist", { id: id + "-list" }, f.suggestions.map(x => h("option", { value: x }))) : null,
        f.hint ? h("span", { class: "hint", style: "font-weight:400", text: f.hint }) : null));

    const submitBtn = h("button", { type: "submit", form: "modal-form", class: "btn primary", text: saveLabel });
    const showErr = msg => { errEl.textContent = msg; errEl.hidden = false; };
    let delBtn = null;
    if (onDelete) {
      let armed = false;
      delBtn = h("button", { type: "button", class: "btn danger", text: "Excluir", onclick: async () => {
        if (!armed) { armed = true; delBtn.classList.add("armed"); delBtn.textContent = "Confirmar exclusão"; return; }
        saving = true; delBtn.disabled = true; submitBtn.disabled = true; delBtn.textContent = "Excluindo…";
        const ok = await onDelete();
        saving = false;
        if (ok) close();
        else { delBtn.disabled = false; submitBtn.disabled = false; delBtn.textContent = "Confirmar exclusão"; showErr("Não foi possível excluir. Tente de novo."); }
      } });
    }
    let extraBtn = null;
    if (extra) {
      let armed = false;
      extraBtn = h("button", { type: "button", class: "btn danger", text: extra.label, onclick: async () => {
        if (!armed) { armed = true; extraBtn.classList.add("armed"); extraBtn.textContent = extra.confirmLabel; return; }
        saving = true; extraBtn.disabled = true; submitBtn.disabled = true; extraBtn.textContent = "Aguarde…";
        const ok = await extra.run();
        saving = false;
        if (ok) close();
        else { extraBtn.disabled = false; submitBtn.disabled = false; extraBtn.textContent = extra.confirmLabel; showErr("Não foi possível concluir. Tente de novo."); }

      e.preventDefault();

      const out = {};
      for (const f of fields) {
        if (!f.key) continue;

      saving = true; submitBtn.disabled = true; submitBtn.textContent = "Salvando…"; errEl.hidden = true;

      submitBtn.disabled = false; submitBtn.textContent = saveLabel;
      showErr(typeof res === "string" ? res : "Não foi possível salvar. O que você digitou continua aqui; tente de novo.");
    });

    document.body.append(scrim);

  async function toggleFocus(t) {

  /* =========================================================

  const goalStatus = g => g.status || "ativa";
  function goalPct(g) {
    const b = Number(g.baseline) || 0, t = Number(g.target) || 0, c = Number(g.current) || 0;
    if (t === b) return c === t && t !== 0 ? 100 : 0;
    return Math.max(0, Math.min(100, Math.round((c - b) / (t - b) * 100)));
  }

  const goalIdleDays = g => goalLastUpdate(g) ? Math.floor((Date.now() - goalLastUpdate(g)) / 86400000) : null;

  function goalOrder(a, b) {
    const sa = goalStale(a) ? 0 : 1, sb = goalStale(b) ? 0 : 1;

  // One history entry per day: a second update on the same day replaces that day's value.

  /* ---------- history: typing a description you used before fills category and payment ---------- */
  function expenseMemory() {
    const all = [...Object.values(S.exp).flat(), ...Object.values(S.expHist).flat()]
      .filter(e => e.desc).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const byDesc = new Map();
    for (const e of all) { const k = e.desc.trim().toLowerCase(); if (!byDesc.has(k)) byDesc.set(k, e); }
    return byDesc;
  }
  const descSuggestions = flow => [...expenseMemory().values()].filter(e => (flow === "entrada") === isIncome(e)).slice(0, 60).map(e => e.desc.trim());

  const expSubs = {};
  function ensureExpSub(mk) {
    if (!db || expSubs[mk]) return;
    expSubs[mk] = coll(expCol(mk)).onSnapshot(snap => {
      S.exp[mk] = snap.docs.map(d => ({ ...d.data(), id: d.id, _mk: mk }));
      S.loaded.add("exp:" + mk);
      S.syncErr.delete("expenses");
      render();
    }, err => {
      if (codeOf(err) === "permission_denied") { S.status = "denied"; render(); return; }
      delete expSubs[mk]; S.syncErr.add("expenses"); render();
      setTimeout(() => ensureExpSub(mk), 5000);
    });
  }
  // Keep listening only to the months on screen: this one, the last one and the one being browsed.
  function syncExpSubs() {
    if (!db) return;
    const cur = monthKey(today()), sel = S.ui.expMonth;
    const wanted = new Set([cur, addMonths(cur, -1), sel, addMonths(sel, -1)]);
    for (const mk of Object.keys(expSubs)) if (!wanted.has(mk)) { expSubs[mk](); delete expSubs[mk]; delete S.exp[mk]; S.loaded.delete("exp:" + mk); }
    for (const mk of wanted) ensureExpSub(mk);
    loadExpHistory();
  }
  // The six-month chart reads older months once; months on screen always come from the live lists above.
  let histLoading = false;
  async function loadExpHistory() {
    if (!db || histLoading) return;
    const months = Array.from({ length: 6 }, (_, i) => addMonths(S.ui.expMonth, -i)).filter(m => !S.exp[m] && !S.expHist[m]);
    if (!months.length) return;
    histLoading = true;
    try {
      for (const m of months) {
        const snap = await coll(expCol(m)).get();
        S.expHist[m] = snap.docs.map(d => ({ ...d.data(), id: d.id, _mk: m }));
      }
    } catch { /* the chart shows only the months it could read */ }
    histLoading = false;
    render();
  }
  const monthItems = mk => (S.exp[mk] || S.expHist[mk] || []).filter(e => inArea(e, e.area || "pessoal"));
  function setExpMonth(mk) { S.ui.expMonth = mk; S.ui.expCat = ""; S.ui.expMethod = ""; S.ui.expBank = ""; syncExpSubs(); render(); }
  async function addExpense(body, id) {
    if (finMode()) { toast("Os gastos agora ficam no Meu Financeiro.", "err"); return false; }
    const mk = monthKey(body.date);
    const ok = id ? await setPath(expCol(mk) + "/" + id, body) : await addDoc(expCol(mk), body);
    // The month index lets the backup find every month; a failure here never loses the expense itself.
    if (ok && !expMonthKnown(mk)) await write(() => db.doc("expenseMonths/" + mk).set({ month: mk }));
    return ok;
  }
  // An installment purchase becomes one entry per month, split to the cent (the first one takes the remainder).
  async function addInstallments(base, n) {
    const totalC = Math.round(base.amount * 100), partC = Math.floor(totalC / n), group = rid("p");
    for (let i = 0; i < n; i++) {
      const cents = partC + (i === 0 ? totalC - partC * n : 0);
      const ok = await addExpense({ ...base, amount: cents / 100, date: shiftMonths(base.date, i), recurring: false,
        installment: { group, n: i + 1, of: n, total: base.amount }, createdAt: Date.now() + i });
      if (!ok) {
        if (i > 0) toast("Foram lançadas " + i + " de " + n + " parcelas. Lance as outras pelo botão + Gasto.", "err");
        return i > 0;
      }
    }
    return true;
  }
  async function deleteInstallments(e) {
    const { group, n } = e.installment;
    const first = addMonths(e._mk, -(n - 1));
    let ok = true;
    for (let i = 0; i < e.installment.of; i++) {
      const m = addMonths(first, i);
      const snap = await coll(expCol(m)).where("installment.group", "==", group).get();
      for (const d of snap.docs) ok = (await deleteDoc(expCol(m), d.id)) && ok;
    }
    if (ok) toast("Parcelas excluídas");
    return ok;
  }
  // Fixed items from last month that were not entered this month yet.
  function pendingFixed(mk) {
    const prev = (S.exp[addMonths(mk, -1)] || []).filter(e => e.recurring && inArea(e, e.area || "pessoal"));
    const have = new Set((S.exp[mk] || []).map(e => e.recurKey).filter(Boolean));
    return prev.filter(e => !have.has(e.recurKey || e.id));
  }
  function launchFixed(e, mk) {
    const { id, _mk, createdAt, installment, ...rest } = e;
    return addExpense({ ...rest, notes: "", recurring: true, recurKey: e.recurKey || e.id,
      date: mk + "-" + pad(Math.min(Number(e.date.slice(8)), daysInMonth(mk))), createdAt: Date.now() });
  }
  async function launchAllFixed(items, mk) {
    let n = 0;
    for (const e of items) { if (await launchFixed(e, mk)) n++; else break; }
    if (n) toast(plural(n, "lançamento fixo feito", "lançamentos fixos feitos"));
  }

  function editExpense(e, flow) {
    if (finMode()) { toast("Os gastos agora ficam no Meu Financeiro. Anote por lá ou pela captura rápida.", "err"); return; }
    const type = e ? (e.type || "saida") : (flow || "saida");
    const income = type === "entrada";
    const memory = expenseMemory();
    const fields = [
      { key: "amount", label: "Valor (R$)", required: true, inputmode: "decimal", placeholder: "0,00" },
      { key: "date", label: "Data", type: "date", required: true },
      { key: "desc", label: "Descrição", full: true, placeholder: income ? "De onde veio?" : "Com o quê?", suggestions: descSuggestions(type),
        onChange: (val, form) => {
          const prev = memory.get(val.trim().toLowerCase());
          if (!prev || e) return;
          if (prev.category && form.elements.category.querySelector('option[value="' + CSS.escape(prev.category) + '"]')) form.elements.category.value = prev.category;
          if (!income && prev.method && form.elements.method) form.elements.method.value = prev.method;
          if (prev.bank && form.elements.bank && [...form.elements.bank.options].some(o => o.value === prev.bank)) form.elements.bank.value = prev.bank;
        } },
      { key: "category", label: "Categoria", type: "select", options: income ? INCOME_CATS : expCatOptions() }
    ];
    if (!income) fields.push({ key: "method", label: "Forma de pagamento", type: "select", options: METHODS });
    fields.push({ key: "bank", label: income ? "Banco / conta que recebeu" : "Banco / conta", type: "select", options: bankOptions(e && e.bank) });
    fields.push(areaField);
    if (!income && !e) fields.push({ key: "parcelas", label: "Parcelas", type: "select", num: true,
      options: Array.from({ length: 24 }, (_, i) => [String(i + 1), i === 0 ? "À vista" : (i + 1) + "x"]),
      hint: "Parcelado no cartão: o valor é dividido e lançado um por mês." });
    if (!e || !e.installment) fields.push({ key: "recurring", label: income ? "Entrada fixa" : "Gasto fixo", type: "checkbox",
      hint: income ? "(salário, todo mês)" : "(aluguel, internet, assinatura: todo mês)" });
    fields.push({ key: "notes", label: "Observação", type: "textarea", rows: 2, full: true });
    if (e && e.installment) fields.unshift({ type: "node", node: h("p", { class: "hint", text: "Parcela " + e.installment.n + " de " + e.installment.of + " · compra de " + brlc(e.installment.total) + ". Editar aqui muda só esta parcela." }) });

    const last = { category: store.get(income ? "capCatIn" : "capCat", income ? "salario" : "alimentacao"), method: store.get("capMethod", ""), bank: store.get(income ? "capBankIn" : "capBank", "") };
    openForm({
      title: e ? (income ? "Editar entrada" : "Editar gasto") : (income ? "Nova entrada" : "Novo gasto"),
      values: e ? { ...e, amount: moneyInput(e.amount), recurring: !!e.recurring }
        : { date: S.ui.expMonth === monthKey(today()) ? today() : S.ui.expMonth + "-01", category: last.category, method: last.method, bank: last.bank, area: defaultArea(), parcelas: 1, recurring: false, ...(S.prefill || {}) },
      fields,
      onSave: async v => {
        const amount = parseMoney(v.amount);
        if (!(amount > 0)) return "Digite um valor maior que zero, por exemplo 45,90.";
        const { parcelas, ...rest } = v;
        const vals = { ...rest, amount, type };
        if (income) delete vals.method;
        if (!e) {
          store.set(income ? "capCatIn" : "capCat", vals.category);
          if (!income) store.set("capMethod", vals.method || "");
          store.set(income ? "capBankIn" : "capBank", vals.bank || "");
          if (parcelas > 1) return addInstallments({ ...vals, recurring: false }, parcelas);
          return addExpense({ ...vals, recurKey: vals.recurring ? rid("r") : "", createdAt: Date.now() });
        }
        if (vals.recurring && !e.recurKey) vals.recurKey = e.id;
        if (e.installment) delete vals.recurring;
        if (!e.type) delete vals.type;   // older entries have no type and count as expenses
        if (monthKey(vals.date) === e._mk) {
          const patch = changed(e, vals);
          return Object.keys(patch).length ? updateDoc(expCol(e._mk), e.id, patch) : true;
        }
        // Moving to another month: copy first, then remove the original only after the copy is saved.
        const { id, _mk, ...old } = e;
        if (!(await addExpense({ ...old, ...vals }, id))) return false;
        if (!(await deleteDoc(expCol(_mk), id))) toast("O lançamento foi para o novo mês, mas a cópia antiga continua. Exclua-a em " + monthLabel(_mk) + ".", "err");
        S.ui.expMonth = monthKey(vals.date); syncExpSubs();
        return true;
      },
      onDelete: e && (() => deleteDoc(expCol(e._mk), e.id)),
      extra: e && e.installment ? { label: "Excluir todas as parcelas", confirmLabel: "Confirmar: excluir " + e.installment.of, run: () => deleteInstallments(e) } : null
    });
    S.prefill = null;
  }
  function expensesBetween(start, end) {
    const out = [];
    for (const mk of new Set([monthKey(start), monthKey(end)])) out.push(...outsOf(expInArea(mk)).filter(e => e.date >= start && e.date <= end));
    return out;
  }

  /* =========================================================
     Meu Financeiro — read its data, write quick expenses there
     ========================================================= */
  // The engine loads as a module after this script; the page redraws once it is ready.
  const FC = () => window.FinCore || null;
  window.addEventListener("fincore", () => render());
  const finUnsubs = {};
  const finDocs = snap => snap.docs.map(d => ({ ...d.data(), id: d.id }));
  function finSub(key, ref, onData, range) {
    if (finUnsubs[key]) return;
    finUnsubs[key] = ref.onSnapshot(snap => {
      onData(snap); S.fin.loaded.add(key); S.fin.err.delete(key);
      if (key !== "txns") syncFinTxns();
      render();
    }, err => {
      S.fin.loaded.add(key); delete finUnsubs[key];
      if (codeOf(err) === "permission_denied") { S.status = "denied"; render(); return; }
      S.fin.err.add(key); render();
      setTimeout(() => { if (key !== "txns" || S.fin.range === range) finSub(key, ref, onData, range); }, 5000);
    });
  }
  function subscribeFin() {
    if (!db) return;
    finSub("settings", db.doc("finSettings/main"), s => { S.fin.settings = s.exists ? s.data() : {}; });
    finSub("share", db.doc("finShare/summary"), s => { S.fin.share = s.exists ? s.data() : null; });
    finSub("accounts", db.collection("finAccounts"), s => { S.fin.accounts = finDocs(s); });
    finSub("cards", db.collection("finCards"), s => { S.fin.cards = finDocs(s); });
    finSub("categories", db.collection("finCategories"), s => { S.fin.categories = finDocs(s); });
    syncFinTxns();
  }
  const finShare = () => (S.fin.settings && S.fin.settings.share) || {};
  // A field is shown only while Meu Financeiro shares it; revoking there hides it here at once.
  const shareOn = field => { const sh = finShare(); return !!sh.enabled && (!sh.fields || sh.fields[field] !== false); };
  // Entries are read only for this month and the last one (enough for the month and the two weeks shown).
  function syncFinTxns() {
    if (!db) return;
    const cur = monthKey(today());
    const want = shareOn("mes") ? addMonths(cur, -1) + "-01|" + cur + "-31" : "";
    if (S.fin.range === want) return;
    if (finUnsubs.txns) { finUnsubs.txns(); delete finUnsubs.txns; }
    S.fin.txns = []; S.fin.loaded.delete("txns"); S.fin.err.delete("txns"); S.fin.range = want;
    if (!want) return;
    const [from, to] = want.split("|");
    finSub("txns", db.collection("finTxns").where("date", ">=", from).where("date", "<=", to), s => { S.fin.txns = finDocs(s); }, want);
  }
  const finLive = arr => arr.filter(x => !x.deleted);
  const CASH_TYPES = new Set(["corrente", "poupanca", "dinheiro"]);
  const finSpendAccounts = () => finLive(S.fin.accounts).filter(a => a.status !== "encerrada" && CASH_TYPES.has(a.type))
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name).localeCompare(b.name));
  const finSpendCards = () => finLive(S.fin.cards).filter(c => c.status !== "cancelado").sort((a, b) => String(a.name).localeCompare(b.name));
  const finExpenseCats = () => finLive(S.fin.categories).filter(c => c.kind === "despesa" && !c.archived)
    .sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
  const finReady = () => ["settings", "accounts", "cards", "categories"].every(k => S.fin.loaded.has(k));
  // Once Meu Financeiro has an account or a card, it is the only place money is recorded.
  const finMode = () => finReady() && (finSpendAccounts().length + finSpendCards().length > 0);
  const finCatName = id => ((S.fin.categories.find(c => c.id === id) || {}).name) || "Sem categoria";
  const finWhere = t => t.cardId ? ((S.fin.cards.find(c => c.id === t.cardId) || {}).name || "cartão")
    : ((S.fin.accounts.find(a => a.id === (t.accountId || t.fromId)) || {}).name || "");
  const brlCents = c => brlc((Number(c) || 0) / 100);
  // Exact up to R$ 999,99; above that the indicator card needs the compact form (R$ 1,2 mil).
  const statMoney = n => Math.abs(n) < 1000 ? brlc(n) : brlShort(n);
  function ago(ms) {
    if (!ms) return "";
    const min = Math.round((Date.now() - ms) / 60000);
    if (min < 1) return "agora";
    if (min < 60) return "há " + min + " min";
    if (min < 60 * 24) return "há " + Math.round(min / 60) + " h";
    return "em " + fmtShort(isoFromMs(ms));
  }
  // The expense goes to Meu Financeiro with its audit entry in the same batch, exactly as that app saves it.
  async function addFinExpense({ amount, desc, categoryId, where, date, area, notes = "" }) {
    const F = FC();
    if (!F) { toast("Ainda carregando as regras do financeiro. Tente de novo em instantes.", "err"); return false; }
    const now = Date.now();
    const txn = { kind: "despesa", desc, date, status: "efetivado", amount, categoryId: categoryId || null, subcategory: "", method: "",
      tags: area && AREAS[area] ? [AREAS[area]] : [], notes, accountId: null, cardId: null, fromId: null, toId: null,
      invoice: null, dueDate: null, paidDate: null, subtype: null, source: "painel", createdAt: now, updatedAt: now };
    if (String(where).startsWith("c:")) {
      const c = finSpendCards().find(x => x.id === where.slice(2));
      if (!c) { toast("Escolha o cartão ou a conta.", "err"); return false; }
      txn.cardId = c.id; txn.method = "credito"; txn.invoice = F.invoiceFor(date, c.closingDay, c.dueDay);
    } else {
      const a = finSpendAccounts().find(x => x.id === String(where).slice(2));
      if (!a) { toast("Escolha a conta ou o cartão.", "err"); return false; }
      txn.accountId = a.id; if (a.type === "dinheiro") txn.method = "dinheiro";
    }
    if (!txn.desc) txn.desc = finCatName(txn.categoryId);
    const err = F.validateTxn(txn, { accounts: S.fin.accounts, cards: S.fin.cards });
    if (err) { toast(err, "err"); return false; }
    return write(() => {
      const fdb = firebase.firestore(), batch = fdb.batch();
      const ref = db.collection("finTxns").doc();
      batch.set(ref, txn);
      batch.set(db.collection("finAudit").doc(), F.auditEntry("criar", "finTxns", ref.id, null, txn, now));
      return batch.commit();
    });
  }
  // Realized spending in a date range, net of refunds — the same rule Meu Financeiro uses.
  function finSpentBetween(start, end) {
    let c = 0;
    for (const t of S.fin.txns) {
      if (t.deleted || t.status !== "efetivado" || t.date < start || t.date > end) continue;
      if (t.kind === "despesa") c += t.amount; else if (t.kind === "estorno") c -= t.amount;
    }
    return c;
  }
  // The balances come from the summary Meu Financeiro publishes. Expenses written here after that
  // moment are known exactly, so they are taken off until the app republishes.
  function finBalances() {
    const sum = S.fin.share;
    if (!sum) return null;
    const after = S.fin.txns.filter(t => !t.deleted && t.source === "painel" && t.status === "efetivado" && t.kind === "despesa" && (t.createdAt || 0) > (sum.updatedAt || 0));
    const cashOut = after.filter(t => t.accountId).reduce((a, t) => a + t.amount, 0);
    const all = after.reduce((a, t) => a + t.amount, 0);
    return {
      cash: sum.saldo ? sum.saldo.cash - cashOut : null,
      invested: sum.saldo ? sum.saldo.invested : null,
      net: sum.patrimonio ? sum.patrimonio.net - all : null,
      pendingN: after.length, updatedAt: sum.updatedAt
    };
  }
  function finMonth() {
    const F = FC();
    if (!F || !shareOn("mes") || !S.fin.loaded.has("txns")) return null;
    return F.monthSummary(S.fin.txns, monthKey(today()));
  }

  /* =========================================================
     Week stats — the same numbers feed Hoje and the weekly review
     ========================================================= */
  function weekRange(offset = 0) {
    const start = addDays(weekStart(today()), 7 * offset);
    return { start, end: addDays(start, 6), s: msOf(start), e: msOf(addDays(start, 7)), id: weekId(start) };
  }
  function rangeFor(start) { return { start, end: addDays(start, 6), s: msOf(start), e: msOf(addDays(start, 7)), id: weekId(start) }; }
  function weekStats(r) {
    const done = list("tasks").filter(t => inArea(t) && taskStatus(t) === "feito" && t.doneAt >= r.s && t.doneAt < r.e);
    const focus = list("tasks").filter(t => inArea(t) && t.focusDate && t.focusDate >= r.start && t.focusDate <= r.end);
    const byLife = {};
    for (const t of done) if (t.lifeArea) byLife[t.lifeArea] = (byLife[t.lifeArea] || 0) + 1;
    let habitsDone = 0, habitsTarget = 0;
    for (const hb of habitsInArea()) {
      const target = Number(hb.targetPerWeek) || 7;
      habitsDone += Math.min(habitCount(hb, r.start), target);
      habitsTarget += target;
    }
    return {
      tasksDone: done.length,
      work: done.filter(t => t.area === "trabalho").length,
      personal: done.filter(t => t.area !== "trabalho").length,
      byLife,
      focusDone: focus.filter(t => taskStatus(t) === "feito").length,
      focusTotal: focus.length,
      habitsDone, habitsTarget,
      events: list("events").filter(e => inArea(e) && e.date >= r.start && e.date <= r.end).length,
      focusMin: sumMin(list("focusSessions").filter(s => inArea(s) && s.date >= r.start && s.date <= r.end)),
      // With Meu Financeiro in use the week's spending comes from there; without the shared month it is not shown.
      spent: finMode() ? (S.fin.loaded.has("txns") ? finSpentBetween(r.start, r.end) / 100 : null) : centsOf(expensesBetween(r.start, r.end)) / 100
    };
  }

  /* =========================================================
     Weekly review
     ========================================================= */
  const reviewFor = id => byId("reviews", id);
  const reviewsSorted = () => list("reviews").slice().sort((a, b) => (b.week || b.id).localeCompare(a.week || a.id));
  function hadActivityBefore(ms) {
    return ["tasks", "habits", "goals"].some(c => list(c).some(x => !String(x.id).startsWith("ex") && (x.createdAt || Infinity) < ms));
  }
  // Sunday: review this week. Monday or Tuesday: last week's review, if it was not done.
  function pendingReviewStart() {
    const t = today(), d = dow(t);
    if (d === 6 && !reviewFor(weekId(t))) return weekStart(t);
    if (d <= 1) {
      const last = addDays(weekStart(t), -7);
      if (!reviewFor(weekId(last)) && hadActivityBefore(msOf(weekStart(t)))) return last;
    }
    return null;
  }
  function statsBox(st) {
    return h("div", { class: "stat-box" },
      h("span", {}, h("strong", { text: plural(st.tasksDone, "tarefa concluída", "tarefas concluídas") }),
        " · " + st.work + " de trabalho, " + st.personal + " pessoais"),
      st.focusTotal ? h("span", { text: "Foco do dia cumprido: " + st.focusDone + " de " + st.focusTotal }) : null,
      st.habitsTarget ? h("span", { text: "Hábitos: " + st.habitsDone + " de " + st.habitsTarget + " na semana" }) : null,
      h("span", { text: plural(st.events, "compromisso", "compromissos") }),
      st.focusMin ? h("span", { text: "Tempo de foco: " + fmtMin(st.focusMin) }) : null,
      st.spent ? h("span", { text: "Gastos registrados: " + brlc(st.spent) }) : null);
  }
  function editReview(start) {
    const r = rangeFor(start), existing = reviewFor(r.id), st = weekStats(r);
    const values = existing ? { ...existing } : {};
    for (const [k] of LIFE) values["score_" + k] = existing?.scores?.[k] ?? "";
    openForm({
      title: "Revisão · " + fmtRange(r.start, r.end),
      values,
      saveLabel: existing ? "Salvar revisão" : "Concluir revisão",
      fields: [
        { type: "heading", label: "A semana em números" },
        { type: "node", node: statsBox(st) },
        ...REVIEW_FIELDS.map(([k, l]) => ({ key: k, label: l, type: "textarea", full: true, rows: 2 })),
        { type: "heading", label: "Como está cada área (1 a 10)" },
        ...LIFE.map(([k, l]) => ({ key: "score_" + k, label: l, type: "select", num: true,
          options: [["", "—"], ...Array.from({ length: 10 }, (_, i) => [String(i + 1), String(i + 1)])] }))
      ],
      onSave: v => {
        const scores = {};
        for (const [k] of LIFE) scores[k] = v["score_" + k] === "" ? null : v["score_" + k];
        const body = { week: r.id, start: r.start, end: r.end, scores, stats: st, updatedAt: Date.now() };
        for (const [k] of REVIEW_FIELDS) body[k] = v[k];
        if (existing) return updateDoc("reviews", r.id, body);
        return setPath("reviews/" + r.id, { ...body, createdAt: Date.now() });
      },
      onDelete: existing && (() => deleteDoc("reviews", r.id))
    });
  }

  function sparkline(g) {
    const pts = (g.history || []).filter(e => typeof e.v === "number");
    if (pts.length < 2) return h("p", { class: "hint", text: pts.length ? "O gráfico aparece a partir da segunda atualização." : "Sem atualizações registradas ainda." });
    const vals = pts.map(p => p.v), b = Number(g.baseline) || 0, t = Number(g.target) || 0;
    const lo = Math.min(...vals, b, t), hi = Math.max(...vals, b, t), span = hi - lo || 1;
    const W = 200, H = 44, P = 4;
    const x = i => P + i * (W - 2 * P) / (pts.length - 1);
    const y = v => H - P - (v - lo) / span * (H - 2 * P);
    const line = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    return svg("svg", { class: "spark", viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", role: "img", "aria-label": "Evolução: " + vals.map(num).join(", ") },

      svg("path", { d: line, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" }),
      svg("circle", { cx: x(pts.length - 1), cy: y(last.v), r: 3, fill: "var(--accent)" }));
  }

  function viewHoje() {
    const t = today(), tomorrow = addDays(t, 1), ws = weekStart(t);
    const nowHM = pad(new Date().getHours()) + ":" + pad(new Date().getMinutes());
    const out = [];

    const pendingStart = pendingReviewStart();
    if (pendingStart) {
      const r = rangeFor(pendingStart);
      out.push(h("div", { class: "notice warn" },
        h("span", {}, h("strong", { text: "Revisão da semana pendente. " }), "Leva 5 minutos e fecha a semana de " + fmtRange(r.start, r.end) + "."),
        h("button", { class: "btn small primary", text: "Fazer revisão", onclick: () => editReview(pendingStart) })));
    }

    const bdToday = list("birthdays").filter(b => nextBday(b) === t);
    if (bdToday.length) out.push(h("div", { class: "notice bday" },
      h("span", {}, "🎂 ", h("strong", { text: "Hoje é aniversário de " + bdToday.map(b => b.name + (bdayAge(b, t) > 0 ? " (" + bdayAge(b, t) + " anos)" : "")).join(", ") + "." }), " Que tal mandar uma mensagem?"),
      h("button", { class: "btn small", text: "Ver aniversários", onclick: go("aniversarios") })));

    /* ---------- the day's numbers ---------- */
    const todayTasks = sortedTasks(openTasks().filter(x => (x.due && x.due <= t) || x.focusDate === t || taskStatus(x) === "fazendo"));

  /* ---------- backup ---------- */
  async function fetchAll(c) {
    if (c === "habitLog" || c === "cards" || c === "reviews" || c === "expenseMonths" || c === "settings") return (await coll(c).get()).docs;
    const docs = [];
    let q = coll(c).orderBy("createdAt").limit(1000);
    for (let guard = 0; guard < 50; guard++) {
      const snap = await q.get();
      docs.push(...snap.docs);
      if (snap.size < 1000) break;
      const lastAt = snap.docs[snap.docs.length - 1].data().createdAt;
      q = coll(c).where("createdAt", ">", lastAt).orderBy("createdAt").limit(1000);
    }
    // Documents without createdAt are not returned by ordered queries; add them from the live list.
    const seen = new Set(docs.map(d => d.id));
    const extra = (S.data[c] || []).filter(x => !seen.has(x.id)).map(x => ({ id: x.id, data: () => { const { id, ...rest } = x; return rest; } }));
    return docs.concat(extra);
  }
  function saveFile(name, text, type = "application/json") {

    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);

  async function exportBackup() {
    if (!db) return;
    const btn = document.getElementById("backup-btn");
    if (btn) { btn.disabled = true; btn.textContent = "Preparando…"; }
    try {
      const out = { painel: "Meu Painel", conta: S.email || "", formato: 2, exportadoEm: new Date().toISOString(), colecoes: {} };
      for (const c of BACKUP_COLS) out.colecoes[c] = (await fetchAll(c)).map(d => ({ id: d.id, ...d.data() }));
      // Every month that has expenses: the index plus whatever is loaded, in case an index write failed.
      const months = new Set([...out.colecoes.expenseMonths.map(m => m.id), ...Object.keys(S.exp)]);
      out.colecoes.expenses = [];
      for (const mk of [...months].sort()) {
        const snap = await coll(expCol(mk)).get();
        out.colecoes.expenses.push(...snap.docs.map(d => ({ id: d.id, month: mk, ...d.data() })));
      }

  // Adds what is missing; never deletes or replaces. Habit logs and month indexes are merged.
  async function importBackup(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch { toast("Esse arquivo não é um backup do painel.", "err"); return; }
    const cols = data && data.colecoes;
    if (!cols || typeof cols !== "object") { toast("Esse arquivo não é um backup do painel.", "err"); return; }
    S.importing = true; render();
    const ops = new Map();   // path -> [body, merge]; one write per document
    let skipped = 0, fresh = 0, done = 0;
    try {
      for (const c of BACKUP_COLS) {
        const docs = Array.isArray(cols[c]) ? cols[c].filter(d => d && d.id) : [];
        if (!docs.length) continue;
        const mergeAlways = c === "habitLog" || c === "expenseMonths";
        const existing = mergeAlways ? new Set() : new Set((await coll(c).get()).docs.map(d => d.id));
        for (const d of docs) {
          if (existing.has(String(d.id))) { skipped++; continue; }
          const { id, ...body } = d;
          ops.set(c + "/" + id, [body, mergeAlways]);
          if (!mergeAlways) fresh++;
        }
      }
      const byMonth = {};
      for (const e of Array.isArray(cols.expenses) ? cols.expenses : []) {
        if (!e || !e.id) continue;
        const mk = /^\d{4}-\d{2}$/.test(e.month) ? e.month : (typeof e.date === "string" ? monthKey(e.date) : "");
        if (mk) (byMonth[mk] = byMonth[mk] || []).push(e);
      }
      for (const [mk, items] of Object.entries(byMonth)) {
        const existing = new Set((await coll(expCol(mk)).get()).docs.map(d => d.id));
        ops.set("expenseMonths/" + mk, [{ month: mk }, true]);
        for (const e of items) {
          if (existing.has(String(e.id))) { skipped++; continue; }
          const { id, month, ...body } = e;
          ops.set(expCol(mk) + "/" + id, [body, false]);
          fresh++;
        }
      }
      const all = [...ops];
      for (let i = 0; i < all.length; i += 400) {
        const chunk = all.slice(i, i + 400);
        const batch = firebase.firestore().batch();
        for (const [path, [body, merge]] of chunk) batch.set(db.doc(path), body, { merge });
        pending++; renderSaveState();
        try { await batch.commit(); } finally { pending--; renderSaveState(); }
        done += chunk.length;
      }
      syncExpSubs();
      toast(fresh ? "Backup importado: " + plural(fresh, "item novo", "itens novos") + (skipped ? " (" + skipped + " já estavam aqui)" : "") : "Nada novo para importar: tudo já estava aqui.");
    } catch (e) {
      toast(errText(e) + (done ? " Foram importados " + done + " itens antes do erro; importe de novo para completar." : ""), "err");
    } finally {
      S.importing = false; render();
    }
  }

      const items = S.exp[m] || (await coll(expCol(m)).get()).docs.map(d => ({ ...d.data(), id: d.id, _mk: m }));
      for (const e of items) if (area === "tudo" || (e.area || "pessoal") === area) rows.push(e);

    return rows.map(e => {
      const inc = isIncome(e), amount = Math.round((Number(e.amount) || 0) * 100) / 100;
      return {
        id: e.id, date: e.date, month: e.date.slice(0, 7), type: inc ? "entrada" : "saida", typeLabel: inc ? "Entrada" : "Saída",
        desc: e.desc || "", category: e.category || "outros", categoryLabel: catLabel(e.category), bank: e.bank || "",
        method: inc ? "" : (METHOD_LABEL[e.method] || ""), installment: e.installment ? e.installment.n + "/" + e.installment.of : "",
        fixed: !!e.recurring, area: AREAS[e.area || "pessoal"] || "", amount, signed: inc ? amount : -amount, notes: e.notes || ""

  }
  function reportSummary(rows) {
    const sum = arr => Math.round(arr.reduce((s, r) => s + r.amount * 100, 0)) / 100;
    const outs = rows.filter(r => r.type === "saida"), ins = rows.filter(r => r.type === "entrada");
    const group = (arr, key) => {
      const m = new Map();
      for (const r of arr) { const k = r[key] || "Não informado"; m.set(k, Math.round(((m.get(k) || 0) + r.amount) * 100) / 100); }
      return [...m].sort((a, b) => b[1] - a[1]);
    };
    const banks = new Map();
    for (const r of rows) {
      const k = r.bank || "Não informado", b = banks.get(k) || { out: 0, in: 0 };
      b[r.type === "entrada" ? "in" : "out"] = Math.round((b[r.type === "entrada" ? "in" : "out"] + r.amount) * 100) / 100;
      banks.set(k, b);
    }
    const months = new Map();
    for (const r of rows) {
      const b = months.get(r.month) || { out: 0, in: 0 };
      b[r.type === "entrada" ? "in" : "out"] = Math.round((b[r.type === "entrada" ? "in" : "out"] + r.amount) * 100) / 100;
      months.set(r.month, b);
    }
    return {
      totalOut: sum(outs), totalIn: sum(ins), count: rows.length, countOut: outs.length,
      byCategory: group(outs, "categoryLabel"), byMethod: group(outs, "method"), byIncome: group(ins, "categoryLabel"),
      byBank: [...banks].sort((a, b) => (b[1].out + b[1].in) - (a[1].out + a[1].in)),
      byMonth: [...months].sort((a, b) => a[0].localeCompare(b[0]))

  }

  const fmtBR = iso => iso.slice(8) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4);

  async function reportPdf(rows, sm, from, to, area) {

    doc.text("Gerado em " + new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + " pelo Meu Painel" + (S.name ? " · " + S.name : ""), M, 86);
    const table = (title, head, body, opts = {}) => {

      doc.text(title, M, y);
      doc.autoTable({ startY: y + 8, head: [head], body, margin: { left: M, right: M }, theme: "grid",
        styles: { font: "helvetica", fontSize: 9, cellPadding: 4, lineColor: [214, 219, 211], textColor: [24, 32, 28] },
        headStyles: { fillColor: green, textColor: 255, fontStyle: "bold" },

    };
    const days = monthsBetween(from, to).reduce((s, m) => s + (m === monthKey(today()) ? Number(today().slice(8)) : daysInMonth(m)), 0);
    const pct = v => sm.totalOut ? Math.round(v / sm.totalOut * 100) + "%" : "";

      [[brlc(sm.totalIn), brlc(sm.totalOut), brlc(sm.totalIn - sm.totalOut), String(sm.count), brlc(sm.totalOut / Math.max(1, days))]]);
    if (sm.byMonth.length > 1) table("Por mês", ["Mês", "Entrou", "Saiu", "Saldo"],

    if (sm.byBank.length) table("Por banco / conta", ["Banco / conta", "Saiu", "Entrou"], sm.byBank.map(([k, v]) => [k, brlc(v.out), brlc(v.in)]),
      { columnStyles: { 1: { halign: "right" }, 2: { halign: "right" } } });
    if (sm.byMethod.length) table("Gastos por forma de pagamento", ["Forma", "Valor", "%"], sm.byMethod.map(([k, v]) => [k, brlc(v), pct(v)]),
      { columnStyles: { 1: { halign: "right" }, 2: { halign: "right" } } });
    if (sm.byIncome.length) table("Entradas por tipo", ["Tipo", "Valor"], sm.byIncome.map(([k, v]) => [k, brlc(v)]), { columnStyles: { 1: { halign: "right" } } });
    table("Lançamentos", ["Data", "Descrição", "Categoria", "Banco", "Pagamento", "Valor"],
      rows.map(r => [fmtBR(r.date), r.desc + (r.installment ? " (" + r.installment + ")" : "") + (r.notes ? "\n" + r.notes : ""), r.categoryLabel, r.bank, r.method,
        (r.type === "entrada" ? "+ " : "") + brlc(r.amount)]),
      { columnStyles: { 0: { cellWidth: 58 }, 5: { halign: "right", cellWidth: 74 } },
        didParseCell: d => { if (d.section === "body" && d.column.index === 5 && rows[d.row.index].type === "entrada") d.cell.styles.textColor = [43, 134, 86]; } });
    const n = doc.getNumberOfPages();

  async function reportXlsx(rows, sm, from, to) {
    await loadScript(LIBS.xlsx);
    const X = window.XLSX;
    const wb = X.utils.book_new();
    const money = "#,##0.00", dateFmt = "dd/mm/yyyy";
    const serial = iso => (Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8)) - Date.UTC(1899, 11, 30)) / 86400000;
    const sheet = (name, header, body, formats = {}, widths = []) => {
      const ws = X.utils.aoa_to_sheet([header, ...body]);
      for (let r = 1; r <= body.length; r++) for (const [c, z] of Object.entries(formats)) {
        const cell = ws[X.utils.encode_cell({ r, c: Number(c) })];
        if (cell && cell.t === "n") cell.z = z;
      }
      ws["!cols"] = header.map((h, i) => ({ wch: widths[i] || Math.max(10, h.length + 2) }));
      if (body.length) ws["!autofilter"] = { ref: ws["!ref"] };
      X.utils.book_append_sheet(wb, ws, name);
    };
    sheet("Lançamentos",
      ["Data", "Mês", "Tipo", "Descrição", "Categoria", "Banco / conta", "Forma de pagamento", "Parcela", "Fixo", "Área", "Valor", "Valor com sinal", "Observação", "ID"],
      rows.map(r => [serial(r.date), r.month, r.typeLabel, r.desc, r.categoryLabel, r.bank, r.method, r.installment, r.fixed ? "Sim" : "Não", r.area, r.amount, r.signed, r.notes, r.id]),
      { 0: dateFmt, 10: money, 11: money }, [12, 9, 9, 30, 22, 16, 18, 8, 6, 10, 12, 14, 30, 22]);
    sheet("Resumo", ["Período", "Entrou", "Saiu", "Saldo", "Lançamentos"],
      [[periodLabel(from, to), sm.totalIn, sm.totalOut, Math.round((sm.totalIn - sm.totalOut) * 100) / 100, sm.count]], { 1: money, 2: money, 3: money }, [28, 14, 14, 14, 12]);
    sheet("Por mês", ["Mês", "Entrou", "Saiu", "Saldo"], sm.byMonth.map(([m, v]) => [m, v.in, v.out, Math.round((v.in - v.out) * 100) / 100]), { 1: money, 2: money, 3: money }, [10, 14, 14, 14]);
    sheet("Por categoria", ["Categoria", "Valor", "%"], sm.byCategory.map(([k, v]) => [k, v, sm.totalOut ? Math.round(v / sm.totalOut * 1000) / 10 : 0]), { 1: money }, [26, 14, 8]);
    sheet("Por banco", ["Banco / conta", "Saiu", "Entrou"], sm.byBank.map(([k, v]) => [k, v.out, v.in]), { 1: money, 2: money }, [22, 14, 14]);
    X.writeFile(wb, "relatorio-financeiro-" + fileStamp(from, to) + ".xlsx");
  }

  // Plain CSV for importing elsewhere: ISO dates, dot decimals, stable ids and codes next to the labels.
  function reportCsv(rows, from, to) {
    const q = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ["id", "data", "mes", "tipo", "descricao", "categoria", "categoria_codigo", "banco", "forma_pagamento", "parcela", "fixo", "area", "valor", "valor_com_sinal", "observacao"];
    const lines = rows.map(r => [r.id, r.date, r.month, r.type, r.desc, r.categoryLabel, r.category, r.bank, r.method, r.installment, r.fixed ? "sim" : "nao", r.area,
      r.amount.toFixed(2), r.signed.toFixed(2), r.notes].map(q).join(","));
    saveFile("lancamentos-" + fileStamp(from, to) + ".csv", "\ufeff" + [head.join(","), ...lines].join("\r\n"), "text/csv;charset=utf-8");
  }

  function openReport() {
    const mk = S.ui.expMonth;
    openForm({
      title: "Relatório financeiro",
      saveLabel: "Gerar relatório",
      values: { from: mk, to: mk, area: S.area, format: store.get("reportFormat", "pdf") },
      fields: [
        { type: "node", node: h("p", { class: "hint", text: "Escolha o período. O PDF é para ler e guardar; o Excel e o CSV trazem todos os lançamentos, um por linha, prontos para importar em outro programa." }) },
        { key: "from", label: "De (mês)", type: "month", required: true, placeholder: "AAAA-MM" },
        { key: "to", label: "Até (mês)", type: "month", required: true, placeholder: "AAAA-MM" },
        { key: "area", label: "Área", type: "select", options: [["tudo", "Todas as áreas"], ["trabalho", "Trabalho"], ["pessoal", "Pessoal"]] },
        { key: "format", label: "Formato", type: "select", options: [["pdf", "PDF (para ler e guardar)"], ["xlsx", "Excel (.xlsx)"], ["csv", "CSV (para importar em outro programa)"]] }
      ],
      onSave: async v => {
        const okMonth = m => /^\d{4}-\d{2}$/.test(m) && +m.slice(5) >= 1 && +m.slice(5) <= 12;
        if (!okMonth(v.from) || !okMonth(v.to)) return "Escolha os meses no formato AAAA-MM, por exemplo 2026-11.";
        if (v.from > v.to) return "O mês inicial precisa ser antes do mês final.";
        if (monthsBetween(v.from, v.to).length >= 60 && addMonths(v.from, 59) < v.to) return "Escolha um período de até 5 anos.";
        store.set("reportFormat", v.format);
        let rows;
        try { rows = await reportEntries(v.from, v.to, v.area); } catch (e) { return "Não foi possível ler os lançamentos. " + errText(e); }
        if (!rows.length) return "Nenhum lançamento nesse período" + (v.area !== "tudo" ? " em " + AREAS[v.area] : "") + ".";
        const sm = reportSummary(rows);
        try {
          if (v.format === "pdf") await reportPdf(rows, sm, v.from, v.to, v.area);
          else if (v.format === "xlsx") await reportXlsx(rows, sm, v.from, v.to);
          else reportCsv(rows, v.from, v.to);
        } catch (e) {
          return e && e.message === "load" ? "Não foi possível baixar o gerador do relatório. Verifique a internet e tente de novo." : "Não foi possível gerar o relatório. Tente de novo.";
        }
        toast("Relatório baixado: " + plural(rows.length, "lançamento", "lançamentos"));
        return true;
      }
    });
  }

  function examplesNotice() {

      let ok = 0;

      toast(ok === ex.length ? "Exemplos apagados" : "Alguns exemplos não foram apagados. Tente de novo.", ok === ex.length ? null : "err");
    } });

    store.set("tab", k);
  }
  window.addEventListener("hashchange", () => { S.ui.more = false; readHash(); render(); window.scrollTo(0, 0); });
  $("#area-seg").addEventListener("click", e => {
    const b = e.target.closest("button[data-area]"); if (!b) return;
    S.area = b.dataset.area; store.set("area", S.area); render();
  });

  /* ---------- live data ---------- */
  function subscribe(c, attempt = 0) {
    (SUB_QUERY[c] ? SUB_QUERY[c](coll(c)) : coll(c)).onSnapshot(snap => {
      S.data[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      S.loaded.add(c);
      if (S.syncErr.delete(c)) attempt = 0;
      render();
    }, err => {
      S.loaded.add(c);
      if (codeOf(err) === "permission_denied") { S.status = "denied"; render(); return; }
      S.syncErr.add(c); render();
      if (attempt < 4) setTimeout(() => subscribe(c, attempt + 1), 3000 * (attempt + 1));
    });
  }
  const monthSubs = {};
  function subscribeMonths() {
    const t = today();
    const wanted = new Set([monthKey(t), monthKey(addDays(weekStart(t), -7))]);
    for (const k of Object.keys(monthSubs)) if (!wanted.has(k)) { monthSubs[k](); delete monthSubs[k]; delete S.habitLog[k]; }
    for (const k of wanted) {
      if (monthSubs[k]) continue;
      monthSubs[k] = db.doc("habitLog/" + k).onSnapshot(snap => {
        S.habitLog[k] = { exists: snap.exists, checks: (snap.exists && snap.data().checks) || {} };
        S.loaded.add("habitLog");
        render();
      }, err => {
        if (codeOf(err) === "permission_denied") { S.status = "denied"; render(); return; }
        S.syncErr.add("habitLog"); delete monthSubs[k]; render();
        setTimeout(() => { S.syncErr.delete("habitLog"); subscribeMonths(); }, 5000);
      });
    }
  }
  let lastDay = today();
  setInterval(() => {
    if (today() === lastDay) return;
    lastDay = today();
    if (db) { subscribeMonths(); syncExpSubs(); syncFinTxns(); }
    render();
  }, 60000);

  readHash();
  render();

  /* =========================================================
     Firebase — Google sign-in, data under users/<uid>/
     ========================================================= */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCjXZbZTQhKS9atYSINtCDpTd4a_kRE3SU",
    authDomain: "meu-paniel.firebaseapp.com",
    projectId: "meu-paniel",
    storageBucket: "meu-paniel.firebasestorage.app",
    messagingSenderId: "296050221551",
    appId: "1:296050221551:web:83efcb462b068bc18f161a"
  };
  // The owner manages who may use the panel (config/access); firestore.rules enforce the same list.
  // Same logic as shared/firebase-config.js, used by Meu Financeiro.
  const OWNER_EMAIL = "luizotaviomoreira30@gmail.com";
  async function checkAccess(fdb, user) {
    const email = String(user.email || "").toLowerCase();
    if (!user.emailVerified) return { ok: false, reason: "unverified" };
    if (email === OWNER_EMAIL) return { ok: true, owner: true };
    try {
      const snap = await fdb.doc("config/access").get();
      const list = snap.exists && Array.isArray(snap.data().emails) ? snap.data().emails : [];
      return list.includes(email) ? { ok: true, owner: false } : { ok: false, reason: "not_listed" };
    } catch (e) { return { ok: false, reason: codeOf(e) === "permission_denied" ? "not_listed" : "offline" }; }
  }

  const loginMsg = $("#login-msg"), loginErr = $("#login-err"), loginBtn = $("#login-btn"), logoutBtn = $("#logout-btn");
  function showLogin(msg, { err = "", canLogin = true, canLogout = false } = {}) {
    document.body.dataset.auth = "out";
    loginMsg.textContent = msg;
    loginErr.textContent = err; loginErr.hidden = !err;
    loginBtn.hidden = !canLogin; loginBtn.disabled = false;
    logoutBtn.hidden = !canLogout;
  }
  function authErrText(e) {
    const c = (e && e.code) || "";
    if (c === "auth/network-request-failed") return "Sem conexão com a internet. Verifique e tente de novo.";
    if (c === "auth/unauthorized-domain") return "Este endereço ainda não foi autorizado no Firebase (Authentication → Configurações → Domínios autorizados).";
    if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "";
    return "Não foi possível entrar. Tente de novo.";
  }

  let auth = null, started = false;
  function startData(uid) {
    if (started) return;
    started = true;
    const fdb = firebase.firestore();
    const base = "users/" + uid + "/";
    db = { collection: p => fdb.collection(base + p), doc: p => fdb.doc(base + p) };
    S.status = "ready";
    for (const c of SUB_COLS) subscribe(c);
    subscribeMonths();
    syncExpSubs();
    subscribeFin();
    render();
  }

  async function boot() {
    if (!window.firebase || !firebase.initializeApp) {
      showLogin("Não foi possível carregar o painel.", { err: "Verifique sua conexão com a internet e recarregue a página.", canLogin: false });
      return;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    const fdb = firebase.firestore();
    fdb.settings({ ignoreUndefinedProperties: true, merge: true });
    // Local test runs talk to the Firebase emulators instead of the real project.
    const local = ["localhost", "127.0.0.1"].includes(location.hostname) && new URLSearchParams(location.search).has("emulador");
    if (local) { auth.useEmulator("http://127.0.0.1:9099", { disableWarnings: true }); fdb.useEmulator("127.0.0.1", 8080); }
    // Keeps a copy on the device: the panel opens fast and shows the last data even without internet.
    try { await fdb.enablePersistence({ synchronizeTabs: true }); } catch {}

    loginBtn.addEventListener("click", async () => {
      loginBtn.disabled = true; loginErr.hidden = true;
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      try { await auth.signInWithPopup(provider); }
      catch (e) {
        const c = (e && e.code) || "";
        if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
          try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
        }
        const msg = authErrText(e);
        loginErr.textContent = msg; loginErr.hidden = !msg;
        loginBtn.disabled = false;
      }
    });
    const signOut = async () => { try { await auth.signOut(); } finally { location.reload(); } };
    logoutBtn.addEventListener("click", signOut);
    $("#signout").addEventListener("click", signOut);
    auth.getRedirectResult().catch(e => { const msg = authErrText(e); if (msg) { loginErr.textContent = msg; loginErr.hidden = false; } });

    auth.onAuthStateChanged(async user => {
      if (!user) { showLogin("Entre com sua conta do Google para ver seus dados."); return; }
      showLogin("Conferindo o seu acesso…", { canLogin: false });
      const access = await checkAccess(fdb, user);
      if (!access.ok) {
        const msgs = {
          offline: ["Não foi possível confirmar o seu acesso.", "Verifique a conexão com a internet e recarregue a página."],
          unverified: ["Esta conta do Google ainda não tem o e-mail verificado.", "Entre com outra conta."],
          not_listed: ["A conta " + (user.email || "escolhida") + " ainda não foi liberada.", "Peça a quem administra o painel para liberar este e-mail. Depois, recarregue a página."]
        };
        const [msg, err] = msgs[access.reason] || msgs.not_listed;
        showLogin(msg, { err, canLogin: false, canLogout: true });
        return;
      }
      S.owner = !!access.owner; S.email = String(user.email || "").toLowerCase();
      if (S.owner) subscribeAccess(fdb);
      S.name = user.displayName || "";
      document.body.dataset.auth = "in";
      startData(user.uid);
    });
  }
  boot();
})();
</script>
</body>
</html>
