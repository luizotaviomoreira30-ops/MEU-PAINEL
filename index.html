<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel Luiz Otávio</title>
<meta name="theme-color" content="#1E5F4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a desk planner — compact header with area switch, top tabs on desktop and a bottom bar on phones, each view a grid of plain panels on a cool green-grey ground. */
:root {
  --bg: #F1F3EF;
  --surface: #FFFFFF;
  --surface-2: #E8EBE5;
  --ink: #18201C;
  --muted: #5C6660;
  --line: #D6DBD3;
  --accent: #1E5F4E;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9EAE3;
  --work: #2952C9;
  --work-soft: #E2E8F9;
  --life: #C0503A;
  --life-soft: #F7E3DD;
  --high: #C2362B;
  --high-soft: #F8E0DD;
  --mid: #A86D12;
  --mid-soft: #F6EAD3;
  --low: #75807A;
  --ok: #2B8656;
  --ok-soft: #DCEFE3;
  --shadow: 0 1px 2px rgba(20, 35, 28, .06), 0 4px 16px rgba(20, 35, 28, .06);
  --scrim: rgba(18, 24, 21, .45);

  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #191E1B; --surface-2: #222824; --ink: #E6EBE7; --muted: #98A29C; --line: #2D3531;
    --accent: #62C2A2; --accent-ink: #0D1A15; --accent-soft: #1D3A30;
    --work: #86A6F7; --work-soft: #1E2944; --life: #EF8D75; --life-soft: #432621;
    --high: #F2776C; --high-soft: #45211E; --mid: #E2AA4E; --mid-soft: #3D2F17; --low: #8D9690;
    --ok: #5EC68D; --ok-soft: #1B3527;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #191E1B; --surface-2: #222824; --ink: #E6EBE7; --muted: #98A29C; --line: #2D3531;
  --accent: #62C2A2; --accent-ink: #0D1A15; --accent-soft: #1D3A30;
  --work: #86A6F7; --work-soft: #1E2944; --life: #EF8D75; --life-soft: #432621;
  --high: #F2776C; --high-soft: #45211E; --mid: #E2AA4E; --mid-soft: #3D2F17; --low: #8D9690;
  --ok: #5EC68D; --ok-soft: #1B3527;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; padding-block: 16px 10px; }
.hello { display: grid; gap: 2px; min-width: 0; }
.hello .date { font-family: var(--f-data); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hello h1 { font-size: clamp(22px, 3.6vw, 30px); font-weight: 700; }
.top-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.save-state { font-family: var(--f-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state.err { color: var(--high); font-weight: 500; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 10px 12px; border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--f-data); font-size: 11px; background: var(--high-soft); color: var(--high); border-radius: 999px; padding: 1px 6px; font-weight: 500; }
.bottomnav { display: none; }

main { padding-block: 20px 64px; display: grid; gap: 16px; }

@media (max-width: 759px) {
  .top { position: static; }
  .tabs { display: none; }
  .top-row { padding-block: 12px 10px; align-items: center; }
  .bottomnav {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  }
  .bottomnav a { display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 4px 0; position: relative; min-width: 0; }
  .bottomnav a span.lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottomnav a[aria-current="page"] { color: var(--accent); }
  .bottomnav svg { width: 22px; height: 22px; }
  .bottomnav .count { position: absolute; top: 0; left: calc(50% + 6px); padding: 0 5px; font-size: 10px; }
  main { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
}

.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; color: var(--muted); font-size: 14px; }
.notice strong { color: var(--ink); }
.notice.warn { border-color: var(--mid); background: var(--mid-soft); color: var(--ink); }
.notice.err { border-color: var(--high); background: var(--high-soft); color: var(--ink); }

/* Panels */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.home { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start; }
@media (max-width: 900px) { .home { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel-head h2 { font-size: 17px; font-weight: 600; }
.panel-head .sub { font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.view-head h2 { font-size: 22px; font-weight: 700; }
.view-head p { margin-top: 2px; color: var(--muted); font-size: 14px; }
.view-head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.section-title { font-size: 18px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; }

/* Buttons & inputs */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { color: var(--high); }
.btn.danger.armed { background: var(--high); color: var(--surface); border-color: var(--high); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 30px; display: inline-grid; place-items: center; font-size: 15px; line-height: 1; color: var(--muted); padding: 0; flex: none; }
.icon-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
.icon-btn:disabled { opacity: .5; }
.field, .inline-form input, .inline-form select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px; min-width: 0; color: var(--ink); }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-form .grow { flex: 1 1 220px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters .grow { flex: 1 1 220px; }
.types { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.type-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.type-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* Chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.work { background: var(--work-soft); color: var(--work); }
.chip.life { background: var(--life-soft); color: var(--life); }
.chip.high { background: var(--high-soft); color: var(--high); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.filter-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.filter-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.due { font-family: var(--f-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.due.late { color: var(--high); font-weight: 500; }
.due.today { color: var(--mid); font-weight: 500; }

/* Task rows */
.list { display: grid; }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.list > .row:first-child { border-top: 0; }
.check { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); margin-top: 1px; padding: 0; display: grid; place-items: center; color: var(--accent-ink); font-size: 12px; }
.check:hover:not(:disabled) { border-color: var(--accent); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check:disabled { opacity: .5; }
.star { flex: none; border: 0; background: none; width: 26px; height: 24px; padding: 0; font-size: 18px; line-height: 1; color: var(--line); }
.star:hover:not(:disabled) { color: var(--mid); }
.star.on { color: var(--mid); }
.row-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.row-title { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; overflow-wrap: anywhere; }
.row-title:hover { color: var(--accent); }
.row.done .row-title { text-decoration: line-through; color: var(--muted); }
.row-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row-actions { display: flex; gap: 6px; flex: none; align-items: center; }
.prio-bar { width: 3px; align-self: stretch; border-radius: 3px; flex: none; background: var(--line); }
.prio-bar.alta { background: var(--high); }
.prio-bar.media { background: var(--mid); }
.group-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.group-label.late { color: var(--high); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; display: grid; gap: 8px; justify-items: start; }
.note-text { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Board */
.board-scroll { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; min-height: 120px; border: 2px dashed transparent; align-content: start; }
.col.over { border-color: var(--accent); }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; gap: 6px; }
.col-head h3 { font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.col-head .n { font-family: var(--f-data); font-size: 12px; color: var(--muted); font-weight: 400; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; cursor: grab; }
.kcard.dragging { opacity: .4; }
.kcard .top-line { display: flex; gap: 6px; align-items: flex-start; }
.kcard .notes { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.kcard .moves { display: flex; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Contacts */
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 600px) { .pipeline { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stage { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.stage[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.stage .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .v { font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); align-items: start; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.person-top { display: flex; gap: 10px; align-items: flex-start; }
.avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.avatar.work { background: var(--work-soft); color: var(--work); }
.avatar.life { background: var(--life-soft); color: var(--life); }
.person-name { border: 0; background: none; padding: 0; text-align: left; font-family: var(--f-display); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.person-name:hover { color: var(--accent); }
.person .co { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; align-items: center; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.kv .val { font-family: var(--f-data); font-size: 12px; overflow-wrap: anywhere; user-select: all; }
.copy { border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 600; padding: 0; flex: none; }
.person .notes { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; border-top: 1px solid var(--line); padding-top: 8px; }

/* Goals */
.goal { display: grid; gap: 8px; }
.goal-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.goal-name { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; overflow-wrap: anywhere; }
.goal-name:hover { color: var(--accent); }
.pct { font-family: var(--f-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.life > span { background: var(--life); }
.bar.work > span { background: var(--work); }
.bar.thin { height: 6px; }
.goal-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.amt { font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.stepper { display: inline-flex; gap: 4px; align-items: center; }
.goal-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.goal-card.stale { border-color: var(--mid); }
.next-action { font-size: 14px; border-left: 3px solid var(--accent); padding-left: 10px; overflow-wrap: anywhere; }
.next-action.missing { border-left-color: var(--mid); color: var(--muted); }
.spark { width: 100%; height: 48px; display: block; }
.hist { display: grid; gap: 4px; font-size: 13px; }
.hist-row { display: grid; grid-template-columns: 72px 72px 1fr; gap: 8px; }
.hist-row .d, .hist-row .v { font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.hist-row .n { overflow-wrap: anywhere; }

/* Week summary */
.kpis { display: grid; gap: 10px; }
.kpi { display: grid; gap: 4px; }
.kpi-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.kpi-line .v { font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi-line .k { color: var(--muted); font-size: 14px; }
.split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.split .w { background: var(--work); }
.split .p { background: var(--life); }

/* Habits */
.habit-grid { display: grid; gap: 0; }
.habit-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.habit-row:first-child { border-top: 0; }
.habit-days { display: grid; grid-template-columns: repeat(7, 34px); gap: 4px; }
.habit-head .habit-days span { font-size: 11px; text-align: center; color: var(--muted); font-weight: 600; line-height: 1.2; }
.hday { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; padding: 0; color: var(--muted); }
.hday[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hday.is-today { border-width: 2px; border-color: var(--accent); }
.hday:disabled { opacity: .35; cursor: default; }
.habit-score { font-family: var(--f-data); font-size: 12px; color: var(--muted); min-width: 44px; text-align: right; }
.habit-score.met { color: var(--ok); font-weight: 500; }
@media (max-width: 600px) {
  .habit-row { grid-template-columns: minmax(0, 1fr) auto; }
  .habit-row .habit-days { grid-column: 1 / -1; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .habit-row .hday { width: 100%; }
  .habit-head { display: none; }
}
.htoday { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.list > .htoday:first-child { border-top: 0; }

/* Life wheel */

  const setPath = (path, body) => write(() => db.doc(path).set(body), path);
  const deleteDoc = (c, id) => write(() => coll(c).doc(id).delete(), c + "/" + id);

  // Only the fields that really changed go to the store, so an edit never overwrites
  // something changed meanwhile on another device.
  function changed(orig, vals) {
    const out = {};
    for (const [k, v] of Object.entries(vals)) {
      const a = orig[k];
      const same = typeof v === "number" ? Number(a ?? 0) === v : String(a ?? "") === String(v ?? "");
      if (!same) out[k] = v;
    }
    return out;
  }

  /* =========================================================
     Toast
     ========================================================= */
  let toastTimer;
  function toast(msg, kind) {
    let t = $(".toast");
    if (!t) { t = h("div", { class: "toast", role: "status", "aria-live": "polite" }); document.body.append(t); }
    t.className = "toast" + (kind === "err" ? " err" : "");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, kind === "err" ? 6000 : 2800);
  }

  /* =========================================================
     Modal form — stays open until the save is confirmed
     ========================================================= */
  function openForm({ title, fields, values = {}, onSave, onDelete, saveLabel = "Salvar" }) {
    let saving = false;
    const onKey = e => { if (e.key === "Escape") close(); };
    const close = () => { if (saving) return; scrim.remove(); document.removeEventListener("keydown", onKey); };
    const form = h("form", { class: "form", id: "modal-form", novalidate: false });
    for (const f of fields) {
      if (f.type === "heading") { form.append(h("div", { class: "form-heading full", text: f.label })); continue; }
      if (f.type === "node") { form.append(h("div", { class: "full" }, f.node)); continue; }
      const id = "f-" + f.key;
      const v = values[f.key] ?? f.default ?? "";
      let input;
      if (f.type === "select") {
        input = h("select", { class: "field", id, name: f.key }, f.options.map(([val, lab]) => h("option", { value: val, text: lab })));
      } else if (f.type === "textarea") {
        input = h("textarea", { class: "field", id, name: f.key, rows: f.rows || 3, placeholder: f.placeholder });
      } else {
        input = h("input", { class: "field", id, name: f.key, type: f.type || "text", required: f.required, step: f.step, inputmode: f.inputmode, placeholder: f.placeholder, autocomplete: "off" });
      }
      input.value = String(v);
      form.append(h("label", { class: f.full ? "full" : null, for: id }, f.label, input, f.hint ? h("span", { class: "hint", style: "font-weight:400", text: f.hint }) : null));
    }
    const errEl = h("p", { class: "form-error", role: "alert", hidden: true });
    const submitBtn = h("button", { type: "submit", form: "modal-form", class: "btn primary", text: saveLabel });
    const showErr = msg => { errEl.textContent = msg; errEl.hidden = false; };
    let delBtn = null;
    if (onDelete) {
      let armed = false;
      delBtn = h("button", { type: "button", class: "btn danger", text: "Excluir", onclick: async () => {
        if (!armed) { armed = true; delBtn.classList.add("armed"); delBtn.textContent = "Confirmar exclusão"; return; }
        saving = true; delBtn.disabled = true; submitBtn.disabled = true; delBtn.textContent = "Excluindo…";
        const ok = await onDelete();
        saving = false;
        if (ok) close();
        else { delBtn.disabled = false; submitBtn.disabled = false; delBtn.textContent = "Confirmar exclusão"; showErr("Não foi possível excluir. Tente de novo."); }
      } });
    }
    const modal = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
      h("h2", { text: title }), form, errEl,
      h("div", { class: "modal-actions" }, delBtn,
        h("div", { class: "right" }, h("button", { type: "button", class: "btn", text: "Cancelar", onclick: close }), submitBtn)));
    form.addEventListener("submit", async e => {
      e.preventDefault();
      if (saving) return;
      const out = {};
      for (const f of fields) {
        if (!f.key) continue;
        let val = form.elements[f.key].value;
        if (f.type === "number") val = val === "" ? (f.blank ? "" : 0) : Number(val);
        else if (f.num) val = val === "" ? "" : Number(val);
        else val = val.trim();
        out[f.key] = val;
      }
      saving = true; submitBtn.disabled = true; submitBtn.textContent = "Salvando…"; errEl.hidden = true;
      let res;
      try { res = await onSave(out); } catch { res = false; }
      saving = false;
      if (res === true) { close(); return; }
      submitBtn.disabled = false; submitBtn.textContent = saveLabel;
      showErr(typeof res === "string" ? res : "Não foi possível salvar. O que você digitou continua aqui; tente de novo.");
    });
    const scrim = h("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } }, modal);
    document.body.append(scrim);
    document.addEventListener("keydown", onKey);
    const first = form.querySelector("input, select, textarea"); first && first.focus();
  }

  const areaField = { key: "area", label: "Área", type: "select", options: Object.entries(AREAS) };
  const lifeField = { key: "lifeArea", label: "Área da vida", type: "select", options: [["", "—"], ...LIFE] };
  const defaultArea = () => S.area !== "tudo" ? S.area : store.get("capArea", "pessoal");

  /* =========================================================
     Tasks — status, focus of the day
     ========================================================= */
  const taskStatus = t => t.status || (t.done ? "feito" : "afazer");
  const isOpenTask = t => { const s = taskStatus(t); return s === "afazer" || s === "fazendo"; };
  function statusPatch(t, st) {
    const wasDone = t && taskStatus(t) === "feito";
    return { status: st, done: st === "feito", doneAt: st === "feito" ? ((wasDone && t.doneAt) || Date.now()) : null };
  }
  const setTaskStatus = (t, st) => updateDoc("tasks", t.id, statusPatch(t, st));
  const toggleDone = t => setTaskStatus(t, taskStatus(t) === "feito" ? "afazer" : "feito");
  async function toggleFocus(t) {
    const d = today();
    if (t.focusDate === d) return updateDoc("tasks", t.id, { focusDate: "" });
    const count = list("tasks").filter(x => x.focusDate === d).length;
    if (count >= FOCUS_MAX) { toast("Seu foco de hoje já tem " + FOCUS_MAX + " tarefas. Tire uma (☆) para incluir outra.", "err"); return false; }
    const patch = { focusDate: d };
    if (taskStatus(t) === "algumdia" || taskStatus(t) === "feito") Object.assign(patch, statusPatch(t, "afazer"));
    const ok = await updateDoc("tasks", t.id, patch);
    if (ok) toast("No foco de hoje");
    return ok;
  }
  function sortedTasks(arr) {
    const t = today();
    return arr.slice().sort((a, b) => {
      const la = a.due && a.due < t ? 0 : 1, lb = b.due && b.due < t ? 0 : 1;
      if (la !== lb) return la - lb;
      const pa = PRIO_RANK[a.priority] ?? 1, pb = PRIO_RANK[b.priority] ?? 1;
      if (pa !== pb) return pa - pb;
      const fa = taskStatus(a) === "fazendo" ? 0 : 1, fb = taskStatus(b) === "fazendo" ? 0 : 1;
      if (fa !== fb) return fa - fb;
      return (a.due || "9999").localeCompare(b.due || "9999");
    });
  }
  const tasksInArea = () => list("tasks").filter(t => inArea(t));
  const openTasks = () => tasksInArea().filter(isOpenTask);
  const focusTasks = () => tasksInArea().filter(t => t.focusDate === today());
  const needsToday = () => openTasks().filter(t => (t.due && t.due <= today()) || taskStatus(t) === "fazendo");

  function editTask(t) {
    openForm({
      title: t ? "Editar tarefa" : "Nova tarefa",
      values: t ? { ...t, status: taskStatus(t) } : { area: defaultArea(), priority: "media", status: "afazer", lifeArea: "" },
      fields: [
        { key: "title", label: "Tarefa", required: true, full: true },
        { key: "notes", label: "Descrição", type: "textarea", full: true },
        areaField, lifeField,
        { key: "priority", label: "Prioridade", type: "select", options: Object.entries(PRIOS) },
        { key: "status", label: "Status", type: "select", options: STATUS },
        { key: "due", label: "Prazo", type: "date", full: true }
      ],
      onSave: v => {
        if (!t) return addDoc("tasks", { ...v, ...statusPatch(null, v.status), focusDate: "", createdAt: Date.now() });
        const patch = changed({ ...t, status: taskStatus(t) }, v);
        if (!Object.keys(patch).length) return true;
        if ("status" in patch) Object.assign(patch, statusPatch(t, v.status));
        return updateDoc("tasks", t.id, patch);
      },
      onDelete: t && (() => deleteDoc("tasks", t.id))
    });
  }

  /* =========================================================
     Goals — progress with history, stalled detection
     ========================================================= */
  const goalStatus = g => g.status || "ativa";
  function goalPct(g) {
    const b = Number(g.baseline) || 0, t = Number(g.target) || 0, c = Number(g.current) || 0;
    if (t === b) return c === t && t !== 0 ? 100 : 0;
    return Math.max(0, Math.min(100, Math.round((c - b) / (t - b) * 100)));
  }
  const goalLastUpdate = g => g.updatedAt || g.createdAt || 0;
  const goalIdleDays = g => goalLastUpdate(g) ? Math.floor((Date.now() - goalLastUpdate(g)) / 86400000) : null;
  const goalStale = g => goalStatus(g) === "ativa" && goalPct(g) < 100 && (goalIdleDays(g) ?? 0) >= STALE_DAYS;
  function goalOrder(a, b) {
    const sa = goalStale(a) ? 0 : 1, sb = goalStale(b) ? 0 : 1;
    if (sa !== sb) return sa - sb;
    return (a.deadline || "9999").localeCompare(b.deadline || "9999");
  }
  // One history entry per day: a second update on the same day replaces that day's value.
  function recordProgress(g, value, note) {
    const d = today();
    const hist = Array.isArray(g.history) ? g.history : [];
    const prev = hist.find(e => e.d === d);
    const next = hist.filter(e => e.d !== d)
      .concat({ d, v: value, n: note ? note : (prev ? prev.n || "" : "") })
      .sort((a, b) => a.d.localeCompare(b.d)).slice(-1000);
    return updateDoc("goals", g.id, { current: value, updatedAt: Date.now(), history: next });
  }
  function bumpGoal(id, dir) {
    const g = byId("goals", id);
    if (!g || busy("goals/" + id)) return;
    recordProgress(g, round2((Number(g.current) || 0) + dir * (Number(g.step) || 1)), "");
  }
  function logGoal(g) {
    openForm({
      title: "Registrar progresso",
      saveLabel: "Registrar",
      values: { value: g.current ?? 0 },
      fields: [
        { type: "node", node: h("p", { class: "hint" }, h("strong", { text: g.title }), " · alvo " + num(g.target) + (g.unit ? " " + g.unit : "")) },
        { key: "value", label: "Novo valor" + (g.unit ? " (" + g.unit + ")" : ""), type: "number", step: "any", inputmode: "decimal", required: true },
        { key: "note", label: "O que aconteceu? (opcional)", type: "textarea", full: true, rows: 2 }
      ],
      onSave: v => recordProgress(byId("goals", g.id) || g, v.value, v.note)
    });
  }
  function editGoal(g) {
    const common = [
      { key: "title", label: "Meta", required: true, full: true },
      areaField, lifeField,
      { key: "unit", label: "Unidade", placeholder: "R$, treinos, livros, kg…" },
      { key: "step", label: "Passo dos botões + / −", type: "number", step: "any", inputmode: "decimal" },
      { key: "baseline", label: "Valor inicial", type: "number", step: "any", inputmode: "decimal", hint: "De onde você partiu. Para metas de reduzir, o inicial é maior que o alvo." },
      { key: "target", label: "Alvo", type: "number", step: "any", inputmode: "decimal", required: true },
      { key: "deadline", label: "Prazo", type: "date" }
    ];
    const tail = [
      { key: "nextAction", label: "Próxima ação", full: true, placeholder: "O passo concreto que move essa meta" },
      { key: "notes", label: "Por que essa meta importa", type: "textarea", full: true, rows: 2 }
    ];
    const validate = v => (v.target === v.baseline ? "O alvo precisa ser diferente do valor inicial." : null);
    if (!g) {
      return openForm({
        title: "Nova meta",
        values: { area: defaultArea(), lifeArea: "", baseline: 0, current: 0, target: 10, step: 1 },
        fields: [...common, { key: "current", label: "Valor atual", type: "number", step: "any", inputmode: "decimal" }, ...tail],
        onSave: v => {
          const bad = validate(v); if (bad) return bad;
          const now = Date.now();
          return addDoc("goals", { ...v, status: "ativa", createdAt: now, updatedAt: now, history: [{ d: today(), v: v.current, n: "Meta criada" }] });
        }
      });
    }
    openForm({
      title: "Editar meta",
      values: { ...g, baseline: g.baseline ?? 0, status: goalStatus(g) },
      fields: [...common, { key: "status", label: "Status", type: "select", options: GOAL_STATUS }, ...tail],
      onSave: v => {
        const bad = validate(v); if (bad) return bad;
        const patch = changed({ ...g, baseline: g.baseline ?? 0, status: goalStatus(g) }, v);
        return Object.keys(patch).length ? updateDoc("goals", g.id, patch) : true;
      },
      onDelete: () => deleteDoc("goals", g.id)
    });
  }

  /* =========================================================
     Habits — one log document per month for all habits
     ========================================================= */
  const habitActive = hb => (hb.state || "ativo") === "ativo";
  const habitsInArea = () => list("habits").filter(hb => habitActive(hb) && inArea(hb, hb.area || "pessoal"))
    .sort((a, b) => (a.order || 0) - (b.order || 0));
  const dayKey = iso => String(Number(iso.slice(8)));
  const isChecked = (id, iso) => !!(S.habitLog[monthKey(iso)]?.checks?.[id]?.[dayKey(iso)]);
  function habitCount(hb, start) {
    let n = 0;
    for (let i = 0; i < 7; i++) if (isChecked(hb.id, addDays(start, i))) n++;
    return n;
  }
  let habitQueue = Promise.resolve();
  function toggleHabit(hb, iso) {
    const key = "habit/" + hb.id + "/" + iso;
    if (busy(key) || iso > today()) return;
    const mk = monthKey(iso), dk = dayKey(iso), next = !isChecked(hb.id, iso);
    // Writes to the month document go one at a time, in order.
    // A merge write creates the month document if needed and only touches this habit's day.
    habitQueue = habitQueue.then(() => write(() =>
      db.doc("habitLog/" + mk).set({ month: mk, checks: { [hb.id]: { [dk]: next } } }, { merge: true }), key));
    return habitQueue;
  }
  function editHabit(hb) {
    openForm({
      title: hb ? "Editar hábito" : "Novo hábito",
      values: hb ? { ...hb, state: hb.state || "ativo", targetPerWeek: hb.targetPerWeek || 7 } : { area: "pessoal", lifeArea: "saude", targetPerWeek: 7, state: "ativo" },
      fields: [
        { key: "name", label: "Hábito", required: true, full: true, placeholder: "Orar, treinar, ler 20 minutos…" },
        lifeField, areaField,
        { key: "targetPerWeek", label: "Meta semanal", type: "select", num: true,
          options: [1, 2, 3, 4, 5, 6, 7].map(n => [String(n), n === 7 ? "Todos os dias" : n + (n === 1 ? " vez" : " vezes") + " por semana"]) },
        { key: "state", label: "Situação", type: "select", options: [["ativo", "Ativo"], ["arquivado", "Arquivado"]] }
      ],
      onSave: v => {
        if (!hb) return addDoc("habits", { ...v, createdAt: Date.now(), order: Date.now() });
        const patch = changed({ ...hb, state: hb.state || "ativo", targetPerWeek: hb.targetPerWeek || 7 }, v);
        return Object.keys(patch).length ? updateDoc("habits", hb.id, patch) : true;
      },
      onDelete: hb && (() => deleteDoc("habits", hb.id))
    });
  }

  /* =========================================================
     Expenses — one small collection per month
     ========================================================= */
  const expCol = mk => "expenseMonths/" + mk + "/items";
  const brlc = n => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(n) || 0);
  const centsOf = arr => arr.reduce((s, e) => s + Math.round((Number(e.amount) || 0) * 100), 0);
  const moneyInput = n => n ? (Math.round(n * 100) / 100).toFixed(2).replace(".", ",") : "";
  // Accepts "45,90", "45.90", "1.234,56", "R$ 12" and "1234.5".
  function parseMoney(s) {
    let t = String(s || "").replace(/[R$\s]/g, "");
    if (!t) return NaN;
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
    const n = Number(t);
    return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  }
  const addMonths = (mk, n) => { const d = parseIso(mk + "-01"); d.setMonth(d.getMonth() + n); return monthKey(isoOf(d)); };
  const monthLabel = mk => { const s = new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" }).format(parseIso(mk + "-01")); return s[0].toUpperCase() + s.slice(1); };
  const expInArea = mk => (S.exp[mk] || []).filter(e => inArea(e, e.area || "pessoal"));
  const expMonthKnown = mk => list("expenseMonths").some(m => m.id === mk);

  const expSubs = {};
  function ensureExpSub(mk) {
    if (!db || expSubs[mk]) return;
    expSubs[mk] = coll(expCol(mk)).onSnapshot(snap => {
      S.exp[mk] = snap.docs.map(d => ({ ...d.data(), id: d.id, _mk: mk }));
      S.loaded.add("exp:" + mk);
      S.syncErr.delete("expenses");
      render();
    }, err => {
      if (codeOf(err) === "permission_denied") { S.status = "denied"; render(); return; }
      delete expSubs[mk]; S.syncErr.add("expenses"); render();
      setTimeout(() => ensureExpSub(mk), 5000);
    });
  }
  // Keep listening only to the months on screen: this one, the last one and the one being browsed.
  function syncExpSubs() {
    if (!db) return;
    const cur = monthKey(today()), sel = S.ui.expMonth;
    const wanted = new Set([cur, addMonths(cur, -1), sel, addMonths(sel, -1)]);
    for (const mk of Object.keys(expSubs)) if (!wanted.has(mk)) { expSubs[mk](); delete expSubs[mk]; delete S.exp[mk]; S.loaded.delete("exp:" + mk); }
    for (const mk of wanted) ensureExpSub(mk);
  }
  function setExpMonth(mk) { S.ui.expMonth = mk; S.ui.expCat = ""; syncExpSubs(); render(); }
  async function addExpense(body, id) {
    const mk = monthKey(body.date);
    const ok = id ? await setPath(expCol(mk) + "/" + id, body) : await addDoc(expCol(mk), body);
    // The month index lets the backup find every month; a failure here never loses the expense itself.
    if (ok && !expMonthKnown(mk)) await write(() => db.doc("expenseMonths/" + mk).set({ month: mk }));
    return ok;
  }
  function editExpense(e) {
    openForm({
      title: e ? "Editar gasto" : "Novo gasto",
      values: e ? { ...e, amount: moneyInput(e.amount) } : { date: S.ui.expMonth === monthKey(today()) ? today() : S.ui.expMonth + "-01", category: store.get("capCat", "alimentacao"), area: defaultArea(), method: "" },
      fields: [
        { key: "amount", label: "Valor (R$)", required: true, inputmode: "decimal", placeholder: "0,00" },
        { key: "date", label: "Data", type: "date", required: true },
        { key: "desc", label: "Descrição", full: true, placeholder: "Com o quê?" },
        { key: "category", label: "Categoria", type: "select", options: EXP_CATS },
        { key: "method", label: "Forma de pagamento", type: "select", options: METHODS },
        areaField
      ],
      onSave: async v => {
        const amount = parseMoney(v.amount);
        if (!(amount > 0)) return "Digite um valor maior que zero, por exemplo 45,90.";
        const vals = { ...v, amount };
        if (!e) return addExpense({ ...vals, createdAt: Date.now() });
        if (monthKey(vals.date) === e._mk) {
          const patch = changed(e, vals);
          return Object.keys(patch).length ? updateDoc(expCol(e._mk), e.id, patch) : true;
        }
        // Moving to another month: copy first, then remove the original only after the copy is saved.
        const { id, _mk, ...rest } = e;
        if (!(await addExpense({ ...rest, ...vals }, id))) return false;
        if (!(await deleteDoc(expCol(_mk), id))) toast("O gasto foi para o novo mês, mas a cópia antiga continua. Exclua-a em " + monthLabel(_mk) + ".", "err");
        S.ui.expMonth = monthKey(vals.date); syncExpSubs();
        return true;
      },
      onDelete: e && (() => deleteDoc(expCol(e._mk), e.id))
    });
  }
  function expensesBetween(start, end) {
    const out = [];
    for (const mk of new Set([monthKey(start), monthKey(end)])) out.push(...expInArea(mk).filter(e => e.date >= start && e.date <= end));
    return out;
  }

  /* =========================================================
     Week stats — the same numbers feed Hoje and the weekly review
     ========================================================= */
  function weekRange(offset = 0) {
    const start = addDays(weekStart(today()), 7 * offset);
    return { start, end: addDays(start, 6), s: msOf(start), e: msOf(addDays(start, 7)), id: weekId(start) };
  }
  function rangeFor(start) { return { start, end: addDays(start, 6), s: msOf(start), e: msOf(addDays(start, 7)), id: weekId(start) }; }
  function weekStats(r) {
    const done = list("tasks").filter(t => inArea(t) && taskStatus(t) === "feito" && t.doneAt >= r.s && t.doneAt < r.e);
    const focus = list("tasks").filter(t => inArea(t) && t.focusDate && t.focusDate >= r.start && t.focusDate <= r.end);
    const byLife = {};
    for (const t of done) if (t.lifeArea) byLife[t.lifeArea] = (byLife[t.lifeArea] || 0) + 1;
    let habitsDone = 0, habitsTarget = 0;
    for (const hb of habitsInArea()) {
      const target = Number(hb.targetPerWeek) || 7;
      habitsDone += Math.min(habitCount(hb, r.start), target);
      habitsTarget += target;
    }
    return {
      tasksDone: done.length,
      work: done.filter(t => t.area === "trabalho").length,
      personal: done.filter(t => t.area !== "trabalho").length,
      byLife,
      focusDone: focus.filter(t => taskStatus(t) === "feito").length,
      focusTotal: focus.length,
      habitsDone, habitsTarget,
      events: list("events").filter(e => inArea(e) && e.date >= r.start && e.date <= r.end).length,
      spent: centsOf(expensesBetween(r.start, r.end)) / 100
    };
  }

  /* =========================================================
     Weekly review
     ========================================================= */
  const reviewFor = id => byId("reviews", id);
  const reviewsSorted = () => list("reviews").slice().sort((a, b) => (b.week || b.id).localeCompare(a.week || a.id));
  function hadActivityBefore(ms) {
    return ["tasks", "habits", "goals"].some(c => list(c).some(x => !String(x.id).startsWith("ex") && (x.createdAt || Infinity) < ms));
  }
  // Sunday: review this week. Monday or Tuesday: last week's review, if it was not done.
  function pendingReviewStart() {
    const t = today(), d = dow(t);
    if (d === 6 && !reviewFor(weekId(t))) return weekStart(t);
    if (d <= 1) {

  /* ---------- backup ---------- */
  async function fetchAll(c) {
    if (c === "habitLog" || c === "cards" || c === "reviews" || c === "expenseMonths") return (await coll(c).get()).docs;
    const docs = [];
    let q = coll(c).orderBy("createdAt").limit(1000);
    for (let guard = 0; guard < 50; guard++) {
      const snap = await q.get();
      docs.push(...snap.docs);
      if (snap.size < 1000) break;
      const lastAt = snap.docs[snap.docs.length - 1].data().createdAt;
      q = coll(c).where("createdAt", ">", lastAt).orderBy("createdAt").limit(1000);
    }
    // Documents without createdAt are not returned by ordered queries; add them from the live list.
    const seen = new Set(docs.map(d => d.id));
    const extra = (S.data[c] || []).filter(x => !seen.has(x.id)).map(x => ({ id: x.id, data: () => { const { id, ...rest } = x; return rest; } }));
    return docs.concat(extra);
  }
  function saveFile(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = h("a", { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
  async function exportBackup() {
    if (!db) return;
    const btn = document.getElementById("backup-btn");
    if (btn) { btn.disabled = true; btn.textContent = "Preparando…"; }
    try {
      const out = { painel: "Painel Luiz Otávio", formato: 2, exportadoEm: new Date().toISOString(), colecoes: {} };
      for (const c of BACKUP_COLS) out.colecoes[c] = (await fetchAll(c)).map(d => ({ id: d.id, ...d.data() }));
      // Every month that has expenses: the index plus whatever is loaded, in case an index write failed.
      const months = new Set([...out.colecoes.expenseMonths.map(m => m.id), ...Object.keys(S.exp)]);
      out.colecoes.expenses = [];
      for (const mk of [...months].sort()) {
        const snap = await coll(expCol(mk)).get();
        out.colecoes.expenses.push(...snap.docs.map(d => ({ id: d.id, month: mk, ...d.data() })));
      }
      saveFile("painel-backup-" + today() + ".json", JSON.stringify(out, null, 2));
      store.set("lastBackup", today());
      toast("Backup baixado");
    } catch (e) {
      toast("Não foi possível gerar o backup. " + errText(e), "err");
    } finally {
      render();
    }

  // Adds what is missing; never deletes or replaces. Habit logs and month indexes are merged.
  async function importBackup(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch { toast("Esse arquivo não é um backup do painel.", "err"); return; }
    const cols = data && data.colecoes;
    if (!cols || typeof cols !== "object") { toast("Esse arquivo não é um backup do painel.", "err"); return; }
    S.importing = true; render();
    const ops = new Map();   // path -> [body, merge]; one write per document
    let skipped = 0, fresh = 0, done = 0;
    try {
      for (const c of BACKUP_COLS) {
        const docs = Array.isArray(cols[c]) ? cols[c].filter(d => d && d.id) : [];
        if (!docs.length) continue;
        const mergeAlways = c === "habitLog" || c === "expenseMonths";
        const existing = mergeAlways ? new Set() : new Set((await coll(c).get()).docs.map(d => d.id));
        for (const d of docs) {
          if (existing.has(String(d.id))) { skipped++; continue; }
          const { id, ...body } = d;
          ops.set(c + "/" + id, [body, mergeAlways]);
          if (!mergeAlways) fresh++;
        }
      }
      const byMonth = {};
      for (const e of Array.isArray(cols.expenses) ? cols.expenses : []) {
        if (!e || !e.id) continue;
        const mk = /^\d{4}-\d{2}$/.test(e.month) ? e.month : (typeof e.date === "string" ? monthKey(e.date) : "");
        if (mk) (byMonth[mk] = byMonth[mk] || []).push(e);
      }
      for (const [mk, items] of Object.entries(byMonth)) {
        const existing = new Set((await coll(expCol(mk)).get()).docs.map(d => d.id));
        ops.set("expenseMonths/" + mk, [{ month: mk }, true]);
        for (const e of items) {
          if (existing.has(String(e.id))) { skipped++; continue; }
          const { id, month, ...body } = e;
          ops.set(expCol(mk) + "/" + id, [body, false]);
          fresh++;
        }
      }
      const all = [...ops];
      for (let i = 0; i < all.length; i += 400) {
        const chunk = all.slice(i, i + 400);
        const batch = firebase.firestore().batch();
        for (const [path, [body, merge]] of chunk) batch.set(db.doc(path), body, { merge });
        pending++; renderSaveState();
        try { await batch.commit(); } finally { pending--; renderSaveState(); }
        done += chunk.length;
      }
      syncExpSubs();
      toast(fresh ? "Backup importado: " + plural(fresh, "item novo", "itens novos") + (skipped ? " (" + skipped + " já estavam aqui)" : "") : "Nada novo para importar: tudo já estava aqui.");
    } catch (e) {
      toast(errText(e) + (done ? " Foram importados " + done + " itens antes do erro; importe de novo para completar." : ""), "err");
    } finally {
      S.importing = false; render();
    }
  }

  /* =========================================================
     Notices
     ========================================================= */
  function statusNotices() {
    const out = [];
    if (S.status === "denied") out.push(h("div", { class: "notice err" }, h("span", {}, h("strong", { text: "Sem permissão para ler seus dados. " }), "Saia e entre de novo com a conta " + ALLOWED_EMAIL + ".")));
    if (S.syncErr.size) out.push(h("div", { class: "notice err" }, h("span", {}, h("strong", { text: "Não foi possível atualizar: " }),
      [...S.syncErr].map(c => COL_PT[c] || c).join(", ") + ". Tentando de novo…")));
    return out;
  }
  function examplesNotice() {
    const ex = [];
    for (const c of ["tasks", "contacts", "goals", "events", "habits", "notes", "cards"])
      for (const it of list(c)) if (String(it.id).startsWith("ex") && isExample(it.title || it.name || it.text)) ex.push([c, it.id]);
    for (const [mk, items] of Object.entries(S.exp))
      for (const it of items) if (String(it.id).startsWith("ex") && isExample(it.desc)) ex.push([expCol(mk), it.id]);
    if (!ex.length) return null;
    let armed = false;
    const btn = h("button", { class: "btn small", text: "Apagar exemplos", onclick: async () => {
      if (!armed) { armed = true; btn.classList.add("danger", "armed"); btn.textContent = "Confirmar: apagar " + ex.length; return; }
      btn.disabled = true; btn.textContent = "Apagando…";
      let ok = 0;
      for (const [c, id] of ex) if (await deleteDoc(c, id)) ok++;
      toast(ok === ex.length ? "Exemplos apagados" : "Alguns exemplos não foram apagados. Tente de novo.", ok === ex.length ? null : "err");
    } });
    return h("div", { class: "notice" },
      h("span", {}, h("strong", { text: "Itens de exemplo. " }), "Os marcados com (exemplo) mostram como cada parte funciona. Edite ou apague quando quiser."), btn);
  }

  /* =========================================================
     Render
     ========================================================= */
  function tabCounts() {
    const t = today();
    return {
      tarefas: needsToday().filter(x => x.due && x.due <= t).length,
      agenda: list("events").filter(e => inArea(e) && e.date === t).length,
      metas: list("goals").filter(g => inArea(g) && goalStale(g)).length,
      contatos: list("contacts").filter(c => c.nextFollowUp && c.nextFollowUp <= t && inArea(c, contactArea(c))).length,
      evolucao: pendingReviewStart() ? 1 : 0
    };
  }
  function icon(name) {
    const el = document.createElementNS(SVG_NS, "svg");
    el.setAttribute("viewBox", "0 0 24 24"); el.setAttribute("fill", "none"); el.setAttribute("stroke", "currentColor");
    el.setAttribute("stroke-width", "1.8"); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
    el.setAttribute("aria-hidden", "true");
    el.innerHTML = ICONS[name]; // constant markup defined above
    return el;
  }
  function renderNav() {
    const counts = tabCounts();
    $("#tabs").replaceChildren(...TABS.map(([k, l]) =>
      h("a", { href: "#" + k, "aria-current": S.tab === k ? "page" : null }, l, counts[k] ? h("span", { class: "count", text: counts[k] }) : null)));
    $("#bottomnav").replaceChildren(...TABS.map(([k, l]) =>
      h("a", { href: "#" + k, "aria-current": S.tab === k ? "page" : null, "aria-label": l + (counts[k] ? " (" + counts[k] + ")" : "") },
        icon(k), h("span", { class: "lbl", text: l }), counts[k] ? h("span", { class: "count", text: counts[k] }) : null)));
  }
  function renderHeader() {
    const d = new Date(), hr = d.getHours();
    const g = hr < 5 ? "Boa noite" : hr < 12 ? "Bom dia" : hr < 18 ? "Boa tarde" : "Boa noite";
    const first = (S.name || "").split(/\s+/)[0];
    $("#greeting").textContent = first ? g + ", " + first : g;
    $("#today-label").textContent = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" }).format(d);
    for (const b of document.querySelectorAll("#area-seg button")) b.setAttribute("aria-pressed", b.dataset.area === S.area ? "true" : "false");
    renderSaveState();
  }
  const VIEWS = { hoje: viewHoje, tarefas: viewTarefas, agenda: viewAgenda, gastos: viewGastos, metas: viewMetas, contatos: viewContatos, evolucao: viewEvolucao };
  function render() {
    // Keep typed text and focus across re-renders.
    const keep = {};
    for (const el of document.querySelectorAll("#main [data-keep]")) keep[el.id] = el.value;
    const ae = document.activeElement, focusId = ae && ae.id;
    let caret = null;
    try { caret = ae && typeof ae.selectionStart === "number" ? ae.selectionStart : null; } catch {}

    renderHeader(); renderNav();
    const out = (VIEWS[S.tab] || viewHoje)();
    $("#main").replaceChildren(...[...statusNotices(), S.tab === "hoje" ? examplesNotice() : null, ...out].filter(Boolean));

    for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = v; }
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (caret != null) el.setSelectionRange(caret, caret); } catch {} }
    }
  }

  /* =========================================================
     Wiring
     ========================================================= */
  function readHash() {
    let k = (location.hash || "").replace("#", "");
    if (k === "quadro") { S.ui.taskMode = "quadro"; store.set("taskMode", "quadro"); }
    k = TAB_ALIASES[k] || k;
    if (!TABS.some(([t]) => t === k)) { const saved = store.get("tab", "hoje"); k = TAB_ALIASES[saved] || saved; }
    if (!TABS.some(([t]) => t === k)) k = "hoje";
    S.tab = k;
    store.set("tab", k);
  }
  window.addEventListener("hashchange", () => { readHash(); render(); window.scrollTo(0, 0); });
  $("#area-seg").addEventListener("click", e => {
    const b = e.target.closest("button[data-area]"); if (!b) return;
    S.area = b.dataset.area; store.set("area", S.area); render();
  });

  /* ---------- live data ---------- */
  function subscribe(c, attempt = 0) {
    coll(c).onSnapshot(snap => {
      S.data[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      S.loaded.add(c);
      if (S.syncErr.delete(c)) attempt = 0;
      render();
    }, err => {
      S.loaded.add(c);
      if (codeOf(err) === "permission_denied") { S.status = "denied"; render(); return; }
      S.syncErr.add(c); render();
      if (attempt < 4) setTimeout(() => subscribe(c, attempt + 1), 3000 * (attempt + 1));
    });
  }
  const monthSubs = {};
  function subscribeMonths() {
    const t = today();
    const wanted = new Set([monthKey(t), monthKey(addDays(weekStart(t), -7))]);
    for (const k of Object.keys(monthSubs)) if (!wanted.has(k)) { monthSubs[k](); delete monthSubs[k]; delete S.habitLog[k]; }
    for (const k of wanted) {
      if (monthSubs[k]) continue;
      monthSubs[k] = db.doc("habitLog/" + k).onSnapshot(snap => {
        S.habitLog[k] = { exists: snap.exists, checks: (snap.exists && snap.data().checks) || {} };
        S.loaded.add("habitLog");
        render();
      }, err => {
        if (codeOf(err) === "permission_denied") { S.status = "denied"; render(); return; }
        S.syncErr.add("habitLog"); delete monthSubs[k]; render();
        setTimeout(() => { S.syncErr.delete("habitLog"); subscribeMonths(); }, 5000);
      });
    }
  }
  let lastDay = today();
  setInterval(() => {
    if (today() === lastDay) return;
    lastDay = today();
    if (db) { subscribeMonths(); syncExpSubs(); }
    render();
  }, 60000);

  readHash();
  render();

  /* =========================================================
     Firebase — Google sign-in, data under users/<uid>/
     ========================================================= */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCjXZbZTQhKS9atYSINtCDpTd4a_kRE3SU",
    authDomain: "meu-paniel.firebaseapp.com",
    projectId: "meu-paniel",
    storageBucket: "meu-paniel.firebasestorage.app",
    messagingSenderId: "296050221551",
    appId: "1:296050221551:web:83efcb462b068bc18f161a"
  };
  // The Firestore rules accept only this account; the page says so instead of showing an empty panel.
  const ALLOWED_EMAIL = "luizotaviomoreira30@gmail.com";

  const loginMsg = $("#login-msg"), loginErr = $("#login-err"), loginBtn = $("#login-btn"), logoutBtn = $("#logout-btn");
  function showLogin(msg, { err = "", canLogin = true, canLogout = false } = {}) {
    document.body.dataset.auth = "out";
    loginMsg.textContent = msg;
    loginErr.textContent = err; loginErr.hidden = !err;
    loginBtn.hidden = !canLogin; loginBtn.disabled = false;
    logoutBtn.hidden = !canLogout;
  }
  function authErrText(e) {
    const c = (e && e.code) || "";
    if (c === "auth/network-request-failed") return "Sem conexão com a internet. Verifique e tente de novo.";
    if (c === "auth/unauthorized-domain") return "Este endereço ainda não foi autorizado no Firebase (Authentication → Configurações → Domínios autorizados).";
    if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "";
    return "Não foi possível entrar. Tente de novo.";
  }

  let auth = null, started = false;
  function startData(uid) {
    if (started) return;
    started = true;
    const fdb = firebase.firestore();
    const base = "users/" + uid + "/";
    db = { collection: p => fdb.collection(base + p), doc: p => fdb.doc(base + p) };
    S.status = "ready";
    for (const c of SUB_COLS) subscribe(c);
    subscribeMonths();
    syncExpSubs();
    render();
  }

  async function boot() {
    if (!window.firebase || !firebase.initializeApp) {
      showLogin("Não foi possível carregar o painel.", { err: "Verifique sua conexão com a internet e recarregue a página.", canLogin: false });
      return;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    const fdb = firebase.firestore();
    fdb.settings({ ignoreUndefinedProperties: true, merge: true });
    // Local test runs talk to the Firebase emulators instead of the real project.
    const local = ["localhost", "127.0.0.1"].includes(location.hostname) && new URLSearchParams(location.search).has("emulador");
    if (local) { auth.useEmulator("http://127.0.0.1:9099", { disableWarnings: true }); fdb.useEmulator("127.0.0.1", 8080); }
    // Keeps a copy on the device: the panel opens fast and shows the last data even without internet.
    try { await fdb.enablePersistence({ synchronizeTabs: true }); } catch {}

    loginBtn.addEventListener("click", async () => {
      loginBtn.disabled = true; loginErr.hidden = true;
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      try { await auth.signInWithPopup(provider); }
      catch (e) {
        const c = (e && e.code) || "";
        if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
          try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
        }
        const msg = authErrText(e);
        loginErr.textContent = msg; loginErr.hidden = !msg;
        loginBtn.disabled = false;
      }
    });
    const signOut = async () => { try { await auth.signOut(); } finally { location.reload(); } };
    logoutBtn.addEventListener("click", signOut);
    $("#signout").addEventListener("click", signOut);
    auth.getRedirectResult().catch(e => { const msg = authErrText(e); if (msg) { loginErr.textContent = msg; loginErr.hidden = false; } });

    auth.onAuthStateChanged(user => {
      if (!user) { showLogin("Entre com sua conta do Google para ver seus dados."); return; }
      if ((user.email || "").toLowerCase() !== ALLOWED_EMAIL) {
        showLogin("A conta " + (user.email || "escolhida") + " não tem acesso a este painel.", { err: "Entre com " + ALLOWED_EMAIL + ".", canLogin: false, canLogout: true });
        return;
      }
      S.name = user.displayName || "";
      document.body.dataset.auth = "in";
      startData(user.uid);
    });
  }
  boot();
})();
</script>
</body>
</html>
